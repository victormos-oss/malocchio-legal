fra la casa."],"wilting-bouquet":["Il malocchio del mazzo di fiori","Che il mazzo appassisca prima di sera.","Che i petali gli cadano in mano.","Che restino solo le spine.","Che provi a spacciarlo per un'idea sua.","Che ci credano, e che adesso se lo aspettino ogni anno."],"heart-balloon":["Il malocchio del palloncino","Che il palloncino a cuore gli sfugga di mano.","Che voli via davanti a tutti.","Che si impigli nei fili proprio davanti alla sua finestra.","Che resti lì fino a marzo.","Che ogni notte brilli sotto il lampione."],"seen-no-reply":["Il malocchio della spunta blu","Che leggano il suo messaggio e non rispondano.","Che veda che sono online.","Che compaia «sta scrivendo...» e poi sparisca.","Che la risposta arrivi tre ore dopo.","Che sia uno sticker."],"couples-everywhere":["Il malocchio delle coppiette","Che tutte le panchine del parco siano occupate da coppiette.","Che lo siano anche i tavolini dei bar.","Che una coppietta gli chieda di scattarle una foto.","Che gli chiedano di rifarla.","Che la foto venga meglio di tutte le sue di quest'anno."]},"pt":{"diarrhea":["O mau-olhado da dor de barriga","Que a barriga dele ronque no momento mais tranquilo do dia.","Que o banheiro mais próximo fique sempre um andar acima.","Que o único banheiro do andar esteja ocupado, e por um bom tempo.","Que dessa porta saia alguém que ele conhece pessoalmente.","Que seja o chefe, e que ele diga: “{name}, agora é a sua vez”."],"sneeze":["O mau-olhado do espirro","Que o nariz coce na parte mais silenciosa da conversa.","Que ele espirre três vezes seguidas.","Que aconteça numa reunião importante, em silêncio absoluto.","Que alguém diga “saúde!” mais alto do que o necessário.","Que a sala inteira se vire, e que a partir de hoje o chamem de “Saúde”."],"hiccups":["O mau-olhado do soluço","Que ele soluce uma vez e ache que se livrou.","Que o soluço volte bem na hora de falar sério.","Que dure exatamente o tempo da fala dele.","Que cada pessoa da sala ofereça uma simpatia diferente.","Que nenhuma funcione, e que passe sozinho assim que ele calar a boca."],"belly-rumble":["O mau-olhado da barriga roncando","Que o estômago lembre baixinho que existe.","Que o show comece no único minuto de silêncio.","Que ronque mais alto do que um estômago deveria roncar.","Que todo mundo finja que não ouviu nada.","Que alguém grave assim mesmo, e que o estômago peça bis."],"damp-sock":["O mau-olhado da meia molhada","Que a meia do pé esquerdo esteja um pouquinho úmida.","Que nunca se descubra de onde veio a água.","Que ele troque de meia e a nova também fique molhada.","Que aconteça numa casa onde se tira o sapato na porta.","Que ele deixe pegadas no piso encerado e ninguém diga nada."],"stuck-seed":["O mau-olhado do fiapo no dente","Que fique alguma coisinha presa entre os dentes dele.","Que a língua não alcance.","Que não exista um palito de dente no prédio inteiro.","Que ele passe a tarde toda pensando nisso e em mais nada.","Que saia sozinho três dias depois, quando ele já tiver se conformado."],"yawn":["O mau-olhado do bocejo","Que os olhos dele lacrimejem no meio da tarde.","Que ele boceje numa reunião importante.","Que o bocejo caia bem na palavra “comprometimento”.","Que quem está falando perceba e olhe direto para ele.","Que na saída perguntem na frente de todos se ele anda dormindo bem."],"sleep-upside-down":["O mau-olhado do sono trocado","Que bata o sono no meio da tarde.","Que à noite não bata nada.","Que às três da manhã a cabeça funcione melhor do que o dia inteiro.","Que a melhor ideia da vida dele chegue às 4h15 e evapore ao amanhecer.","Que ele pegue no sono exatamente dez minutos antes do despertador tocar."],"battery-one-percent":["O mau-olhado do um por cento","Que o celular esteja pela metade antes do almoço.","Que dure mais no um por cento do que durava nos vinte.","Que o celular desligue bem na hora que ele mais precisa.","Que seja no meio do caminho, num bairro que ele não conhece.","Que tenha uma tomada do lado e o carregador tenha ficado em casa."],"wifi-drop":["O mau-olhado do Wi-Fi","Que a página demore um segundo a mais que o normal.","Que a internet caia na melhor parte.","Que a conexão volte bem quando já não faz diferença.","Que para o resto da casa tudo funcione perfeitamente.","Que o roteador pisque verdinho e finja que não é com ele."],"charger-wrong-side":["O mau-olhado do carregador","Que o cabo não entre de primeira.","Que o cabo não entre de nenhum dos dois lados.","Que o carregador bom esteja em outro cômodo e ele ainda não saiba.","Que o cabo emprestado seja de outra entrada.","Que apareça o único que encaixa, e que ele não carregue."],"autocorrect":["O mau-olhado do corretor automático","Que o celular troque uma letra inofensiva.","Que troque justamente a palavra que não podia ser tocada.","Que a mensagem saia antes que ele consiga reler.","Que leiam antes que ele chegue no “editar”.","Que a única resposta seja um print da própria mensagem dele."],"bluetooth-stranger":["O mau-olhado do Bluetooth","Que o fone demore para conectar.","Que conecte no aparelho de outra pessoa.","Que esse aparelho seja a caixa de som da sala de espera.","Que esteja tocando justo aquilo que ele não ia mostrar para ninguém.","Que o volume esteja no máximo e o pause não esteja onde ele procura."],"update-before-talk":["O mau-olhado da atualização","Que o sistema lembre da atualização na hora errada.","Que o sistema resolva começar sozinho.","Que comece um minuto antes da apresentação.","Que a barrinha trave nos quarenta e sete por cento.","Que o “não desligue o computador” dure exatamente o que duraria a fala dele."],"third-password":["O mau-olhado da senha","Que a senha certa não venha à cabeça de imediato.","Que venha só na terceira tentativa.","Que na terceira tentativa a conta seja bloqueada.","Que o sistema recuse a nova por ser parecida demais com a antiga.","Que no fim funcione a primeira que ele tentou."],"wrong-screenshot":["O mau-olhado do print","Que na galeria tenha dois prints quase idênticos.","Que ele mande o errado.","Que mande para a pessoa errada.","Que lá em cima apareça uma linha de outra conversa.","Que respondam “ué, e isso?” e o “apagar para todos” já não funcione."],"red-lights":["O mau-olhado do semáforo","Que o sinal feche bem na hora que ele chegar.","Que todos os sinais do caminho façam o mesmo.","Que a faixa do lado ande.","Que ele mude de faixa e a que ele deixou dispare.","Que o último sinal abra um segundo depois do que ele precisava."],"jam-at-your-turn":["O mau-olhado do trânsito","Que a pista esteja livre até a saída dele.","Que o engarrafamento comece onde já não dá para sair.","Que o Waze sugira um desvio mais longo.","Que ele pegue o desvio e a via principal libere na hora.","Que nunca se saiba o motivo: que lá na frente não tenha absolutamente nada."],"parking-just-missed":["O mau-olhado da vaga","Que a vaga mais perto esteja ocupada.","Que ele dê uma volta no quarteirão.","Que a vaga libere trinta segundos depois que ele passar.","Que ele volte e alguém tenha pegado de novo.","Que ele pare a dois quarteirões e ali comece a chover."],"every-floor":["O mau-olhado do elevador","Que o elevador demore um pouco mais que o normal.","Que pare em todos os andares.","Que em nenhum deles tenha alguém esperando.","Que no último entre alguém e desça até o térreo.","Que a porta abra onde ele começou e ele tenha que sair."],"other-queue":["O mau-olhado da outra fila","Que a fila dele ande um pouco mais devagar que a do lado.","Que a do lado ande três vezes mais rápido.","Que ele mude para a rápida e vire o último.","Que no caixa dele chamem o gerente para liberar um estorno.","Que quem estava atrás dele já saia com as compras na mão."],"metro-doors":["O mau-olhado da porta do metrô","Que ele chegue na plataforma no último segundo.","Que a porta feche na cara dele.","Que o próximo trem demore oito minutos.","Que o próximo chegue lotado.","Que pela janela do que foi embora ele veja um assento vazio que ninguém pega."],"taxi-across-street":["O mau-olhado do Uber","Que o carro demore para chegar.","Que o motorista pare do outro lado da rua.","Que a faixa de pedestre fique a duzentos metros.","Que o motorista ligue bem quando ele estiver no meio da avenida.","Que o carro faça o retorno enquanto ele atravessa e pare onde ele estava."],"escalator-closed":["O mau-olhado da escada rolante","Que a escada rolante ande mais devagar que o normal.","Que a que ele precisa esteja parada.","Que a parada seja justo a de subida.","Que do lado tenha uma escada comum de quarenta degraus.","Que lá em cima ele descubra que a saída certa era embaixo."],"cold-coffee":["O mau-olhado do café frio","Que o cafezinho esfrie um pouco mais rápido que o normal.","Que esfrie um segundo antes do primeiro gole.","Que requentado fique com gosto de ontem.","Que tragam outro quando ele já estiver vestindo o casaco.","Que o último gole seja só borra."],"last-slice":["O mau-olhado do último pedaço","Que sobrem menos pedaços do que ele tinha contado.","Que peguem o último bem na frente dele.","Que quem pegue seja alguém que já comeu dois.","Que ele pergunte “você não vai comer, né?” e ninguém responda.","Que na travessa sobre uma folha de alface, e que seja de outra pessoa."],"ketchup-shot":["O mau-olhado do ketchup","Que no começo não saia nada do frasco.","Que depois saia tudo de uma vez.","Que o jato vá direto em alguma coisa branca.","Que a mancha caia no peito e não na calça.","Que a água aumente a mancha e o guardanapo deixe fiapos."],"pizza-temperature":["O mau-olhado da pizza","Que o primeiro pedaço esteja mais quente do que parece.","Que queime o céu da boca.","Que o segundo pedaço já esteja frio.","Que ele fique a noite toda passando a língua na queimadura.","Que o queijo escorregue inteiro e caia virado para baixo."],"empty-fridge":["O mau-olhado da geladeira","Que na geladeira não tenha o que ele veio buscar.","Que ele abra de novo um minuto depois.","Que abra cinco vezes e não apareça comida nenhuma.","Que a única coisa comestível       document.documentElement.lang = locale

      const curseId = get('c')
      const charm = DATA.catalog[curseId] === 'charm'
      const victim = get('n')
      const level = Math.max(0, POWERS.indexOf(get('p')))

      let title = get('t')
      let text = get('x')
      if (!title) {
        const entry = (DATA.texts[locale] || {})[curseId]
        if (entry) {
          title = entry[0]
          text = entry[1 + level].split('{name}').join(victim)
        }
      }

      // textContent, не innerHTML: всё это пришло из адреса, набрать его может
      // кто угодно.
      const set = (id, value) => { document.getElementById(id).textContent = value }
      set('kicker', charm ? words.kickerCharm : words.kicker)
      if (charm) document.getElementById('kicker').classList.add('charm')
      set('victim', victim)
      set('title', title || '')
      set('text', text || '')
      set('reflect', charm ? words.reflectCharm : words.reflect)
      set('install', words.install)
      set('note', title ? words.note : words.unknown)
      if (!title) document.getElementById('card').classList.add('missing')

      const reflectLink = document.getElementById('reflect')
      reflectLink.href = 'malocchio://reflect?' + params.toString()

      // malocchio:// открывает только iPhone с приложением. На компьютере и
      // Android кнопка молча ничего не делала, и это выглядело поломкой. Теперь
      // страница говорит, что делать. На iPhone без приложения браузер тоже
      // молчит: если через две секунды страница всё ещё на экране, значит
      // приложение не открылось, и подсказка ведёт к установке.
      const hint = document.getElementById('hint')
      const showHint = (text) => {
        hint.textContent = text
        hint.hidden = false
      }
      // Приложение есть на iPhone и на Android (APK), там кнопка его открывает.
      const isPhone = /iPhone|iPad|iPod|Android/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)

      reflectLink.addEventListener('click', (event) => {
        if (!isPhone) {
          event.preventDefault()
          showHint(words.desktop)
          return
        }
        const timer = setTimeout(() => {
          if (!document.hidden) showHint(words.missing)
        }, 2000)
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) clearTimeout(timer)
        }, { once: true })
      })
      const install = document.getElementById('install')
      install.href = DATA.install
      // Из магазина приложений malocchio:// не долетает, поэтому перед
      // переходом ссылка на сглаз кладётся в буфер: новое приложение при
      // первом запуске предложит ответить на неё кнопкой «Вставить».
      install.addEventListener('click', () => {
        try {
          navigator.clipboard?.writeText(location.href).catch(() => undefined)
        } catch (error) {
          // буфер недоступен: человек сможет вставить ссылку руками
        }
      })
    </script>
  </body>
</html>
