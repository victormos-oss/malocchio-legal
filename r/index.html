      /*
        Страница ответного сглаза. Одна и без зависимостей, как политика
        рядом: её задача открыться с QR на любом телефоне за секунду.
        Шаблон, данные подставляет scripts/reflect-page.ts.
      */
      :root {
        --ink: #0b0a0c;
        --ink-raised: #141216;
        --brass: #c9a227;
        --brass-dim: #8a701a;
        --blood-text: #d6495c;
        --ash: #9a9298;
        --ash-dim: #857d85;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--ink); }
      body {
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
        color: var(--ash);
        font: 16px/1.55 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background:
          radial-gradient(60% 45% at 50% 30%, rgba(255, 154, 60, 0.12), transparent 70%),
          var(--ink);
      }
      main {
        width: 100%;
        max-width: 26rem;
        border: 1px solid var(--brass-dim);
        border-radius: 6px;
        padding: 1.75rem 1.25rem;
        background: rgba(20, 18, 22, 0.7);
        text-align: center;
      }
      .brand {
        margin: 0 0 1.25rem;
        font-size: 0.7rem;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: var(--brass);
      }
      .kicker {
        margin: 0;
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--blood-text);
      }
      .kicker.charm { color: var(--brass); }
      .victim {
        margin: 0.5rem 0 1rem;
        font: 600 2rem/1.15 Georgia, 'Times New Roman', serif;
        color: var(--ash);
        overflow-wrap: anywhere;
      }
      .title {
        margin: 0 0 0.5rem;
        font: 600 1.35rem/1.25 Georgia, 'Times New Roman', serif;
        color: var(--brass);
      }
      .text {
        margin: 0 0 1.5rem;
        font: italic 1.15rem/1.45 Georgia, 'Times New Roman', serif;
        color: var(--ash);
      }
      .actions { display: grid; gap: 0.75rem; }
      a.button {
        display: block;
        padding: 0.85rem 1rem;
        border-radius: 4px;
        text-decoration: none;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-size: 0.85rem;
        transition: transform 120ms ease, opacity 120ms ease;
      }
      a.button:active { transform: scale(0.98); opacity: 0.85; }
      a.primary { background: var(--brass); color: var(--ink); }
      a.secondary { border: 1px solid var(--brass); color: var(--brass); }
      a.button:focus-visible { outline: 2px solid var(--ash); outline-offset: 3px; }
      .note { margin: 1.25rem 0 0; font-size: 0.8rem; color: var(--ash-dim); }
      .missing .curse { display: none; }
    </style>

ce of the moisture never be found.","May he change socks, and may the new one get wet too.","May it happen at a house where shoes come off at the door.","May he leave a trail across the floor, and may the hosts say nothing."],"stuck-seed":["The Stuck Seed","May something small lodge between his teeth.","May his tongue fail to reach it.","May there be no toothpick in the entire building.","May he think about it all evening and about nothing else.","May it come out on its own three days later, once he has made peace with it."],"yawn":["The Yawn","May his eyes water in the middle of the afternoon.","May he yawn during an important meeting.","May the yawn land on the word \"engagement\".","May the speaker notice and look straight at him.","May someone ask him afterwards, in front of everyone, if he is getting enough rest."],"sleep-upside-down":["The Sleep Curse","May he want to lie down in the middle of the day.","May sleep refuse to come at night.","May his mind work better at three in the morning than it did all day.","May the best idea of his life arrive at 4:15 and be gone by breakfast.","May he fall asleep exactly ten minutes before the alarm."],"battery-one-percent":["The One Percent","May his phone be down to half by lunch.","May it survive longer at one percent than it did at twenty.","May the phone die at the exact moment he needs it.","May that moment be mid-route in a part of town he does not know.","May there be an outlet right there, and may the cable be at home."],"wifi-drop":["The Wi-Fi Curse","May the page take one second longer than usual.","May the connection drop at the best part.","May the connection come back the instant he no longer needs it.","May everyone else in the building be perfectly fine.","May the router blink green and pretend it had nothing to do with it."],"charger-wrong-side":["The Charger Curse","May the plug refuse to go in the first time.","May the plug fit neither way round.","May the right charger be in another room, a fact he does not know yet.","May the borrowed cable turn out to be the wrong connector.","May the one cable that fits be found, and may it not charge."],"autocorrect":["The Autocorrect Curse","May his phone fix one harmless letter.","May it fix the one word that should never have been touched.","May the message send before he can read it back.","May the message be read before he reaches \"edit\".","May the only reply be a screenshot of his own message."],"bluetooth-stranger":["The Bluetooth Curse","May his earbuds take a moment to connect.","May they connect to somebody else’s device.","May the device they land on be a speaker in a shared room.","May the thing playing be the thing he was never going to show anyone.","May the volume be at maximum and the pause button be nowhere he looks."],"update-before-talk":["The Update Curse","May the update remind him of itself at a bad time.","May the update start on its own.","May it start one minute before the presentation.","May the bar stop at forty-seven percent.","May \"do not turn off your computer\" stay on screen for exactly the length of his talk."],"third-password":["The Password Curse","May the right password not come to him at once.","May it come on the third attempt.","May the third attempt lock the account.","May the new password be refused for looking too much like the old one.","May the one that finally works be the first one he tried."],"wrong-screenshot":["The Screenshot Curse","May there be two near-identical screenshots in his gallery.","May he send the wrong one.","May he send it to the wrong person.","May the top of it show one line of somebody else’s chat.","May the reply be \"what is this?\", and may \"delete for everyone\" have expired."],"red-lights":["The Red Lights","May one light turn red just as he reaches it.","May every light on his route do the same.","May the next lane keep moving.","May he change lanes, and may the lane he left start moving.","May the last green arrive one second later than he needed it "May the exit he wanted turn out to have been downstairs."],"cold-coffee":["The Cold Coffee","May his coffee cool slightly faster than usual.","May it go cold one second before the first sip.","May the reheated cup taste wrong.","May the fresh one arrive as he is putting his coat on.","May the last mouthful be grounds."],"last-slice":["The Last Slice","May there be fewer slices left than he counted on.","May the last one be taken right in front of him.","May it be taken by the person who has already had two.","May he ask \"you are not having that, are you?\" and get no answer.","May one lettuce leaf be left on the plate, and may it be somebody else’s."],"ketchup-shot":["The Ketchup Curse","May nothing at all come out of the bottle at first.","May all of it come out at once after that.","May it land on something white.","May the stain be on his chest and not on his lap.","May water make it bigger and the napkin leave lint behind."],"pizza-temperature":["The Pizza Curse","May the first slice be hotter than it looks.","May it burn the roof of his mouth.","May the second slice already be cold by then.","May he keep touching the burnt spot with his tongue all evening.","May the cheese slide off in one sheet and land face down."],"empty-fridge":["The Empty Fridge","May the thing he came for not be in the fridge.","May he open it again a minute later.","May he open it five times, and may no food appear.","May the only edible thing be one day out of date.","May he smell it anyway, and may he eat it anyway."],"courier-in-shower":["The Doorbell Curse","May the courier arrive ahead of schedule.","May he call the minute the water comes on.","May he call exactly once.","May the door code in the app be the old one.","May the parcel be left with the neighbour who is never home."],"one-sip-left":["The Last Sip","May there be less in the bottle than he thought.","May exactly one mouthful remain.","May that mouthful be warm.","May the next bottle be the last one in the house.","May the shop across the road close three minutes before he gets there."],"chips-run-out":["The Empty Bag","May the bag turn out to be half air.","May it run out at the best part of the film.","May there be one crumb left at the bottom.","May the last crumb end up in the sofa.","May it be found a week later, and not by him."],"white-shirt-stain":["The White Shirt","May a small dot appear on the new white shirt.","May it appear within the first ten minutes.","May it be sauce and not water.","May it sit exactly where people look while talking to him.","May the wash make it paler and never make it go."],"loose-shoelace":["The Loose Lace","May the lace loosen after a hundred metres.","May it come undone completely.","May it happen in the middle of a crossing.","May the other one come undone the moment he ties the first.","May the end of the lace be wet."],"vanishing-keys":["The Vanishing Keys","May the keys be in the wrong pocket.","May they disappear for exactly seven minutes.","May he turn the whole flat over.","May they turn up in the most obvious place.","May that be the place he checked first."],"toilet-paper":["The Empty Roll","May the roll be thinner than it looked.","May it run out at the worst possible moment.","May the spare be in the cupboard behind the door.","May the cupboard be three steps away and those steps be impossible.","May there be somebody in the house he now has to call by name."],"unswattable-fly":["The Unswattable Fly","May one fly appear in the room.","May it circle him and nobody else.","May it land only where it cannot be swatted.","May it vanish the moment he picks up a newspaper.","May it come back at night and land on his forehead."],"night-mosquito":["The Night Mosquito","May a mosquito start up somewhere in the room.","May it exist only at night and only beside his ear.","May it be nowhere at all with the light on.","May it fall silent the second {name} closes his eyes.","May there be exactly one bite by morning, and may it be on his eyelid."],"tangled-earphones":["The Tangled Cord","May the cord twist slightly.","May it tangle in an empty pocket.","May the knot be where there are only two centimetres of cable.","May untangling it take exactly as long as the song he wanted.","May only the left one work afterwards."],"forgotten-word":["The Lost Word","May the word he needs arrive a second late.","May it vanish in the middle of the story.","May everyone go quiet and wait.","May someone helpfully suggest the wrong word.","May the real one come back at three in the morning, with nobody left to tell."],"low-fuel-light":["The Fuel Light","May the fuel light come on during the longest stretch of road.","May the nearest station be closed.","May the next one have a queue of three cars with trailers.","May the pump on his side be out of order, and may the filler cap be on the other.","May he pull out and see that the station across the road is cheaper."],"bird-on-hood":["The Pigeon Curse","May a pigeon mark his hood.","May it be a freshly washed hood.","May the next one land on the windshield, right at eye level.","May the washer tank be empty.","May the wipers spread it across the whole glass, and may the sun be straight ahead."],"car-alarm-night":["The Car Alarm","May the alarm go off for no reason.","May it happen at three in the morning.","May everyone in the building know whose car it is.","May the key fob be in the other jacket.","May the alarm stop on its own while he looks for the fob, and may it start again once he is back in bed."],"speed-bump":["The Speed Bump","May there be a speed bump where nobody expected one.","May there be no sign before it.","May a full cup of coffee be in the holder at that moment.","May something clank underneath.","May that something stay on the road, and may the mirror show exactly what it was."],"slow-truck":["The Slow Truck","May there be a truck ahead.","May the road be a single lane.","May the line be solid all the way to the horizon.","May a convoy come the other way at the first gap.","May there be a second truck ahead the moment he finally passes."],"check-engine":["The Check Engine Light","May an unfamiliar icon light up on the dashboard.","May it go out on the way to the garage.","May the garage say they found nothing.","May the icon come back on as he leaves the garage.","May the mechanic shrug and say it does that on all of them."],"navigator-lost":["The Navigator Curse","May the navigator lose the satellites at the interchange.","May it say “turn right” one second after the turn.","May it reroute him through the back streets.","May there be a barrier in the back streets.","May it announce “you have arrived” in front of a blank fence."],"tight-parking":["The Tight Parking","May someone park too close.","May it be on the driver’s side.","May he have to climb in through the passenger seat.","May a colleague walk past at that very moment.","May the neighbor drive away as soon as he is in."],"candy-bowl":["The Candy Curse","May the candy bowl hold nothing but hard mints.","May the mints be stuck together.","May the only chocolate turn out to be raisin.","May he eat it anyway, and may it have a nut in it too.","May the trick-or-treaters look into the bowl and walk away in silence."],"costume-fail":["The Costume Curse","May the costume get hot within ten minutes.","May the eyeholes slide sideways.","May someone else at the party wear the very same costume.","May theirs be better.","May everyone spend the evening mistaking him for the other one."],"pumpkin-rot":["The Pumpkin Curse","May the pumpkin carve a little crooked.","May its grin cave in.","May the candle inside go out with every breath of wind.","May the pumpkin slump sideways by morning.","May the neighbour’s pumpkin last until Christmas."],"jump-scare":["The Horror Movie Curse","May he jump at the most predictable moment.","May he spill the popcorn doing it.","May everyone in the room see.","May someone rewind and play it again.","May he spend half the night checking that the wardrobe door is shut."],"empty-doorbell":["The Doorbell Curse","May the doorbell ring while he is in the shower.","May he rush out in a towel.","May there be nobody at the door.","May it ring again exactly five minutes later.","May it turn out to be a cat that has learned to jump at the button."],"creaky-floor":["The Creaky Floor Curse","May one floorboard creak in the night.","May it be the one he just stepped on.","May another one creak in reply, one nobody stepped on.","May he switch on the light and find nothing.","May it turn out in the morning that the board only creaks at night."],"cobweb-face":["The Cobweb Curse","May he walk face first into a cobweb.","May it be invisible and endless.","May he feel it on his cheek all day.","May its owner turn up in his hood.","May he find out during a meeting."],"black-cat":["The Black Cat Curse","May a black cat cross his path.","May it come back and cross it again, to be sure.","May it sit in the middle of the pavement and refuse to be walked around.","May it follow him all the way home.","May it turn out at home that the cat now lives with him."],"lucky-ticket":["The Exam Charm","May the exam hand him a familiar question.","May it be the very one he managed to read.","May the examiner be in a good mood.","May the follow-up question be the one thing he knows best.","May the grade surprise even him."],"green-wave":["The Green Light Charm","May the first light turn green just as he reaches it.","May every light on his route do the same.","May the next lane stand still.","May the navigation app be surprised at how fast he got there.","May he arrive before he would have left on a normal day."],"parking-by-door":["The Parking Charm","May there be a free space right by the entrance.","May it be a wide one.","May the car in it pull out the very second he arrives.","May there be no puddles beside it.","May someone he likes take the space when he leaves."],"fast-queue":["The Queue Charm","May his queue move faster than the next one.","May a new till open and call him first.","May the cashier have change.","May a discount apply that he never knew about.","May someone in the other queue watch him leave with deep respect."],"full-battery":["The Battery Charm","May his phone last until evening.","May half the charge still be left by then.","May there be a charger at every socket he passes.","May the cable go in the right way the first time.","May his friends start asking him for a charger."],"sunny-weekend":["The Weekend Charm","May the weekend be sunny.","May the forecast rain pass them by.","May it rain again on Monday, since he is at work anyway.","May nobody call about work on Saturday.","May the weekend somehow turn out one day longer."],"hot-coffee":["The Hot Coffee Charm","May his coffee stay hot to the last sip.","May nobody interrupt him while he drinks it.","May there be a biscuit to go with it.","May it be the last biscuit, and may it go to him.","May the barista remember him and start adding a little more foam."],"found-keys":["The Keys Charm","May his keys always turn up on the first try.","May they be in the first pocket he checks.","May his glasses be there too.","May the remote be there as well.","May he finally learn where the other socks go."]},"es":{"diarrhea":["El mal de la diarrea","Que le suene la tripa en el momento más tranquilo del día.","Que el baño más cercano esté siempre un piso más arriba.","Que el único baño de la planta esté ocupado, y para rato.","Que de esa puerta salga alguien a quien conoce en persona.","Que sea su jefe, y que le diga: «{name}, ahora te toca a ti»."],"sneeze":["El mal del estornudo","Que le pique la nariz en la parte más callada de la charla.","Que estornude tres veces seguidas.","Que ocurra en una reunión importante, en silencio absoluto.","Que alguien diga «salud» más alto de lo necesario.","Que se gire toda la sala, y que desde hoy lo llamen así."],"hiccups":["El mal del hipo","Que hipe una vez y crea que se ha librado.","Que el hipo vuelva justo cuando tenga que hablar en serio.","Que dure exactamente lo que dure su intervención.","Que cada persona de la sala le ofrezca su propio remedio.","Que ninguno funcione, y que se le pase solo en cuanto se calle."],"belly-rumble":["El mal de las tripas","Que el estómago le recuerde bajito que existe.","Que empiece el concierto en el único minuto de silencio.","Que suene más fuerte de lo que un estómago debería sonar.","Que todos disimulen como si no hubieran oído nada.","Que alguien lo grabe igualmente, y que el estómago repita."],"damp-sock":["El mal del calcetín húmedo","Que el calcetín izquierdo esté un poco húmedo.","Que nunca se sepa de dónde salió el agua.","Que se cambie de calcetines y el nuevo también se moje.","Que pase en una casa donde hay que descalzarse en la puerta.","Que deje un rastro de pisadas en el parqué y que nadie diga nada."],"stuck-seed":["El mal de la semilla","Que se le quede algo pequeño entre los dientes.","Que la lengua no llegue.","Que no haya un palillo en todo el edificio.","Que piense en eso toda la tarde y en nada más.","Que salga sola tres días después, cuando ya se haya resignado."],"yawn":["El mal del bostezo","Que le lloren los ojos a media tarde.","Que bostece en una reunión importante.","Que el bostezo caiga justo en la palabra «compromiso».","Que quien habla lo note y lo mire directamente.","Que al salir le pregunten delante de todos si duerme bien."],"sleep-upside-down":["El mal del sueño","Que le entre sueño a media tarde.","Que por la noche no le entre nada.","Que a las tres de la mañana la cabeza le funcione mejor que en todo el día.","Que la mejor idea de su vida llegue a las 4:15 y se pierda al amanecer.","Que se duerma exactamente diez minutos antes de que suene el despertador."],"battery-one-percent":["El mal del uno por ciento","Que el móvil esté a la mitad antes de comer.","Que aguante más al uno por ciento que al veinte.","Que el móvil se apague justo cuando hace falta.","Que sea a mitad de camino en un barrio que no conoce.","Que haya un enchufe al lado y el cable se haya quedado en casa."],"wifi-drop":["El mal del wifi","Que la página tarde un segundo más de lo normal.","Que se caiga la conexión en la mejor parte.","Que la conexión vuelva justo cuando ya da igual.","Que a los demás de la casa les funcione todo perfectamente.","Que el router parpadee en verde y haga como si no fuera con él."],"charger-wrong-side":["El mal del cargador","Que el cable no entre a la primera.","Que el cable no entre por ninguno de los dos lados.","Que el cargador bueno esté en otra habitación y él aún no lo sepa.","Que el cable prestado sea de otro conector.","Que aparezca el único que encaja y que no cargue."],"autocorrect":["El mal del autocorrector","Que el móvil le corrija una letra inofensiva.","Que le corrija justo la palabra que no había que tocar.","Que el mensaje salga antes de que pueda releerlo.","Que lean el mensaje antes de que llegue a «editar».","Que la única respuesta sea una captura de su propio mensaje."],"bluetooth-stranger":["El mal del bluetooth","Que los auriculares tarden en conectarse.","Que se conecten al aparato de otra persona.","Que el aparato al que se conecten sea el altavoz de una sala común.","Que esté sonando justo lo que no pensaba enseñarle a nadie.","Que el volumen esté al máximo y la pausa no esté donde la busca."],"update-before-talk":["El mal de la actualización","Que el sistema le recuerde la actualización en mal momento.","Que el sistema la empiece solo.","Que la empiece un minuto antes de la presentación.","Que la barra se quede en el cuarenta y siete por ciento.","Que el «no apague el equipo» dure justo lo que habría durado su charla."],"third-password":["El mal de la contraseña","Que la contraseña buena no le venga a la cabeza enseguida.","Que le venga al tercer intento.","Que al tercer intento se bloquee la cuenta.","Que el sistema rechace la nueva por parecerse demasiado a la vieja.","Que al final funcione la primera que probó."],"wrong-screenshot":["El mal de la captura","Que en la galería haya dos capturas casi idénticas.","Que mande la que no era.","Que se la mande a quien no era.","Que arriba se vea una línea de otra conversación.","Que le respondan «¿y esto?» y que «eliminar para todos» ya no funcione."],"red-lights":["El mal de los semáforos","Que un semáforo se ponga en rojo justo al llegar él.","Que hagan lo mismo todos los del trayecto.","Que el carril de al lado avance.","Que se cambie de carril y arranque el que acaba de dejar.","Que el último verde llegue un segundo más tarde de lo que necesitaba."],"jam-at-your-turn":["El mal del atasco","Que la carretera esté despejada justo hasta su salida.","Que el atasco empiece donde ya no se puede salir.","Que el navegador proponga un desvío más largo.","Que coja el desvío y que la vía principal se despeje al instante.","Que nunca se sepa la causa: que delante no haya absolutamente nada."],"parking-just-missed":["El mal del aparcamiento","Que el sitio más cercano esté ocupado.","Que dé una vuelta a la manzana.","Que quede libre treinta segundos después de que él se vaya.","Que vuelva y que se lo hayan cogido otra vez.","Que aparque a dos manzanas y que allí empiece a llover."],"every-floor":["El mal del ascensor","Que el ascensor tarde un poco más de lo normal.","Que pare en todas las plantas.","Que en ninguna haya nadie esperando.","Que en la última entre alguien y baje hasta el portal.","Que las puertas se abran donde empezó y que tenga que salir."],"other-queue":["El mal de la otra fila","Que su fila avance un poco más lenta que la de al lado.","Que la de al lado vaya tres veces más rápido.","Que se cambie a la rápida y quede el último.","Que en su caja llamen al encargado.","Que quien estaba detrás de él ya salga con la compra hecha."],"metro-doors":["El mal de las puertas","Que llegue al andén en el último segundo.","Que las puertas se cierren delante de sus narices.","Que el siguiente tren tarde ocho minutos.","Que el siguiente tren llegue lleno.","Que por la ventanilla del que se va vea un asiento libre que nadie ocupa."],"taxi-across-street":["El mal del taxi","Que el coche tarde en llegar.","Que el conductor pare en la acera de enfrente.","Que el paso de peatones esté a doscientos metros.","Que el conductor llame justo cuando él esté en mitad de la calzada.","Que el taxi dé la vuelta mientras camina y pare donde él estaba."],"escalator-closed":["El mal de la escalera mecánica","Que la escalera vaya más lenta de lo normal.","Que la que necesita esté cerrada.","Que la cerrada sea justo la de subida.","Que al lado haya una escalera de cuarenta peldaños.","Que arriba descubra que la salida buena estaba abajo."],"cold-coffee":["El mal del café frío","Que el café se enfríe un poco más rápido de lo normal.","Que se enfríe justo un segundo antes del primer sorbo.","Que recalentado sepa mal.","Que le traigan otro cuando ya se está poniendo el abrigo.","Que el último trago sea todo poso."],"last-slice":["El mal del último trozo","Que queden menos trozos de los que había contado.","Que el último se lo lleven delante de él.","Que se lo lleve quien ya se ha comido dos.","Que pregunte «no te lo vas a comer, ¿no?» y no le contesten.","Que en la bandeja quede una hoja de lechuga y que sea de otro."],"ketchup-shot":["El mal del kétchup","Que del bote no salga nada al principio.","Que después salga todo de golpe.","Que salga disparado hacia algo blanco.","Que la mancha caiga en el pecho y no en el pantalón.","Que el agua la haga más grande y la servilleta le deje pelusa."],"pizza-temperature":["El mal de la pizza","Que el primer trozo esté más caliente de lo que parece.","Que le queme el paladar.","Que el segundo trozo ya esté frío.","Que se toque la quemadura con la lengua toda la noche.","Que el queso se deslice entero y caiga boca abajo."],"empty-fridge":["El mal de la nevera","Que en la nevera no esté lo que venía a buscar.","Que la abra otra vez un minuto después.","Que la abra cinco veces y que no aparezca más comida.","Que lo único comestible esté caducado de ayer.","Que lo huela igualmente y se lo coma igualmente."],"courier-in-shower":["El mal del repartidor","Que el repartidor llegue antes de tiempo.","Que llame justo en el minuto en que se mete en la ducha.","Que llame una sola vez.","Que el código del portal en la aplicación sea el antiguo.","Que dejen el paquete en casa del vecino que nunca está."],"one-sip-left":["El mal del último trago","Que en la botella haya menos de lo que creía.","Que quede exactamente un trago.","Que ese trago esté caliente.","Que la siguiente botella sea la última de la casa.","Que la tienda de enfrente cierre tres minutos antes de que llegue."],"chips-run-out":["El mal de las patatas","Que la bolsa resulte estar medio vacía.","Que se acabe en la mejor parte de la película.","Que en el fondo quede una sola miga.","Que la última miga acabe en el sofá.","Que aparezca una semana después y que no la encuentre él."],"white-shirt-stain":["El mal de la mancha","Que en la camiseta blanca nueva aparezca un puntito.","Que aparezca en los primeros diez minutos.","Que sea salsa y no agua.","Que caiga justo donde mira la gente cuando habla con él.","Que el lavado la deje más clara y no la quite nunca."],"loose-shoelace":["El mal del cordón","Que el cordón se afloje a los cien metros.","Que se desate del todo.","Que pase en mitad de un paso de peatones.","Que el otro se desate en cuanto ate el primero.","Que la punta del cordón esté mojada."],"vanishing-keys":["El mal de las llaves","Que las llaves estén en el bolsillo equivocado.","Que desaparezcan exactamente siete minutos.","Que ponga la casa del revés.","Que aparezcan en el sitio más evidente.","Que sea el sitio que miró primero."],"toilet-paper":["El mal del papel","Que el rollo sea más fino de lo que parecía.","Que se acabe en el peor momento posible.","Que el de repuesto esté en el armario de detrás de la puerta.","Que el armario esté a tres pasos y que esos pasos no se puedan dar.","Que haya alguien en casa a quien ahora toca llamar por su nombre."],"unswattable-fly":["El mal de la mosca","Que aparezca una mosca en la habitación.","Que vuele solo alrededor de él.","Que se pose solo donde no se la puede aplastar.","Que desaparezca en cuanto coja el periódico.","Que vuelva de noche y se le pose en la frente."],"night-mosquito":["El mal del mosquito","Que en algún rincón empiece a sonar un mosquito.","Que exista solo de noche y solo junto a su oreja.","Que con la luz encendida no esté en ninguna parte.","Que se calle justo cuando {name} cierra los ojos.","Que por la mañana haya una sola picadura y que sea en el párpado."],"tangled-earphones":["El mal de los cascos","Que el cable se retuerza un poco.","Que se enrede hasta en un bolsillo vacío.","Que el nudo caiga donde solo hay dos centímetros de cable.","Que desenredarlo dure exactamente lo que dura la canción que quería.","Que después solo funcione el izquierdo."],"forgotten-word":["El mal de la palabra","Que la palabra que busca llegue un segundo tarde.","Que se le borre justo en mitad de la historia.","Que todos se callen y esperen.","Que alguien le sople una palabra que no es.","Que la buena vuelva a las tres de la mañana, sin nadie a quien contársela."],"low-fuel-light":["El mal de la reserva","Que el testigo de la reserva se encienda en el tramo más largo.","Que la gasolinera más cercana esté cerrada.","Que en la siguiente haya cola de tres coches con remolque.","Que el surtidor de su lado no funcione y la tapa del depósito esté en el otro.","Que al salir vea que la gasolinera de enfrente es más barata."],"bird-on-hood":["El mal de la paloma","Que una paloma le marque el capó.","Que sea un capó recién lavado.","Que la siguiente caiga en el parabrisas, justo a la altura de los ojos.","Que el depósito del limpiaparabrisas esté vacío.","Que las escobillas lo extiendan por todo el cristal y que el sol esté de frente."],"car-alarm-night":["El mal de la alarma","Que la alarma salte sin motivo.","Que sea a las tres de la madrugada.","Que todo el vecindario sepa de quién es el coche.","Que el mando esté en la otra chaqueta.","Que la alarma se calle sola mientras busca el mando y que vuelva a saltar cuando se acueste."],"speed-bump":["El mal del badén","Que haya un badén donde nadie lo esperaba.","Que no haya señal antes.","Que en ese momento lleve un café lleno en el posavasos.","Que algo suene debajo del coche.","Que ese algo se quede en la carretera y que por el espejo se vea qué era."],"slow-truck":["El mal del camión","Que delante vaya un camión.","Que la carretera sea de un solo carril.","Que la línea sea continua hasta el horizonte.","Que en el primer hueco venga una caravana de frente.","Que cuando por fin adelante, delante haya otro."],"check-engine":["El mal del testigo del motor","Que en el salpicadero se encienda un icono desconocido.","Que se apague de camino al taller.","Que en el taller digan que no han encontrado nada.","Que el icono vuelva a encenderse al salir del taller.","Que el mecánico se encoja de hombros y diga que eso lo hacen todos."],"navigator-lost":["El mal del navegador","Que el navegador pierda los satélites en el nudo de carreteras.","Que diga «gire a la derecha» un segundo después del giro.","Que recalcule la ruta por callejones.","Que en los callejones haya una barrera.","Que anuncie «ha llegado a su destino» delante de una tapia."],"tight-parking":["El mal del vecino de plaza","Que le aparquen demasiado cerca.","Que sea por el lado del conductor.","Que tenga que entrar por el asiento del copiloto.","Que en ese momento pase un compañero de trabajo.","Que en cuanto consiga entrar, el vecino se vaya."],"candy-bowl":["El mal de los caramelos","Que en el bol de caramelos solo queden los de menta.","Que los de menta estén pegados entre sí.","Que el único bombón resulte ser de pasas.","Que se lo coma igualmente y que además lleve nuez.","Que los niños del truco o trato miren el bol y se vayan sin decir nada."],"costume-fail":["El mal del disfraz","Que el disfraz dé calor a los diez minutos.","Que los agujeros de la máscara se tuerzan.","Que en la fiesta haya otra persona con el mismo disfraz.","Que el suyo sea mejor.","Que toda la noche le confundan con el otro."],"pumpkin-rot":["El mal de la calabaza","Que la calabaza quede un poco torcida al tallarla.","Que se le hunda la sonrisa.","Que la vela de dentro se apague con cada soplo de viento.","Que por la mañana la calabaza se haya desplomado de lado.","Que la del vecino aguante hasta Navidad."],"jump-scare":["El mal de la peli de miedo","Que se asuste en el momento más previsible.","Que se le caiga todo el bol de palomitas.","Que lo vea todo el mundo en el salón.","Que alguien rebobine y lo vuelva a poner.","Que se pase media noche comprobando que el armario está cerrado."],"empty-doorbell":["El mal del timbre","Que suene el timbre justo cuando está en la ducha.","Que salga corriendo con la toalla.","Que en la puerta no haya nadie.","Que vuelva a sonar exactamente cinco minutos después.","Que resulte ser un gato que ha aprendido a saltar al botón."],"creaky-floor":["El mal de la tabla que cruje","Que de noche cruja una tabla del suelo.","Que sea justo la que acaba de pisar.","Que le conteste otra que no ha pisado nadie.","Que encienda la luz y no haya nada.","Que por la mañana descubra que la tabla solo cruje de noche."],"cobweb-face":["El mal de la telaraña","Que se meta de cara en una telaraña.","Que sea invisible e interminable.","Que la note en la mejilla todo el día.","Que la dueña aparezca en su capucha.","Que lo descubra en plena reunión."],"black-cat":["El mal del gato negro","Que se le cruce un gato negro.","Que vuelva y se le cruce otra vez, por si acaso.","Que se siente en mitad de la acera y no le deje pasar.","Que le siga hasta casa.","Que en casa descubra que el gato ahora vive con él."],"lucky-ticket":["El amuleto del examen","Que en el examen le toque una pregunta conocida.","Que sea justo la que le dio tiempo a leer.","Que el profesor esté de buen humor.","Que la pregunta extra sea lo que mejor sabe.","Que la nota le sorprenda hasta a él."],"green-wave":["El amuleto del semáforo en verde","Que el primer semáforo se ponga en verde justo al llegar él.","Que hagan lo mismo todos los del trayecto.","Que el carril de al lado se quede parado.","Que hasta el navegador se sorprenda de lo rápido que ha llegado.","Que llegue antes de lo que saldría un día normal."],"parking-by-door":["El amuleto del aparcamiento","Que haya un sitio libre justo al lado de la entrada.","Que sea amplio.","Que el coche que lo ocupa se vaya en el segundo en que llegue él.","Que no haya charcos al lado.","Que al irse lo ocupe alguien que le cae bien."],"fast-queue":["El amuleto de la cola","Que su cola avance más rápido que la de al lado.","Que abran una caja nueva y le llamen a él primero.","Que la cajera tenga cambio.","Que le apliquen un descuento que ni conocía.","Que alguien de la otra cola le mire salir con profundo respeto."],"full-battery":["El amuleto de la batería","Que el móvil le aguante hasta la noche.","Que a esa hora aún le quede la mitad.","Que haya un cargador en cada enchufe por el que pase.","Que el cable entre del lado bueno a la primera.","Que sean sus amigos los que le pidan el cargador a él."],"sunny-weekend":["El amuleto del fin de semana","Que el fin de semana salga el sol.","Que la lluvia del pronóstico pase de largo.","Que vuelva a llover el lunes, total, ya está trabajando.","Que el sábado nadie le llame por trabajo.","Que el fin de semana, sin saber por qué, dure un día más."],"hot-coffee":["El amuleto del café caliente","Que el café esté caliente hasta el último sorbo.","Que nadie le interrumpa mientras se lo toma.","Que haya una galleta para acompañarlo.","Que sea la última y le toque a él.","Que el barista le reconozca y empiece a ponerle más espuma."],"found-keys":["El amuleto de las llaves","Que las llaves aparezcan siempre a la primera.","Que estén en el primer bolsillo que mire.","Que las gafas estén ahí también.","Que el mando de la tele también.","Que por fin descubra adónde van los calcetines desparejados."]}}}

      const WORDS = {
        ru: {
          kicker: 'На вас наложен сглаз',
          kickerCharm: 'Вам подарили оберег',
          reflect: 'Отразить сглаз',
          reflectCharm: 'Подарить в ответ',
          install: 'Установить Malocchio',
          note: 'Шутка. Никакой магии здесь нет. Отразить можно в приложении: оно бесплатное.',
          unknown: 'Сглаз из новой версии приложения. Откройте Malocchio, чтобы его увидеть.',
        },
        en: {
          kicker: 'You have been cursed',
          kickerCharm: 'You have been given a charm',
          reflect: 'Send it back',
          reflectCharm: 'Return the favour',
          install: 'Get Malocchio',
          note: 'A joke. There is no magic here. You can send it back in the app, it is free.',
          unknown: 'This curse comes from a newer version of the app. Open Malocchio to see it.',
        },
        es: {
          kicker: 'Te han echado un mal de ojo',
          kickerCharm: 'Te han regalado un amuleto',
          reflect: 'Devolver el mal',
          reflectCharm: 'Corresponder',
          install: 'Instalar Malocchio',
          note: 'Es una broma. Aquí no hay magia. Puedes devolverlo en la app, es gratis.',
          unknown: 'Este mal viene de una versión más nueva de la app. Abre Malocchio para verlo.',
        },
      }
      const POWERS = ['harmless', 'annoying', 'nasty', 'harsh', 'apocalyptic']

      const params = new URLSearchParams(location.hash.slice(1))
      const get = (key) => (params.get(key) || '').slice(0, 160)

      const system = (navigator.language || 'en').slice(0, 2)
      const locale = WORDS[get('l')] ? get('l') : WORDS[system] ? system : 'en'
      const words = WORDS[locale]
      document.documentElement.lang = locale

      const curseId = get('c')
      const charm = DATA.catalog[curseId] === 'charm'
      const victim = get('n')
      const level = Math.max(0, POWERS.indexOf(get('p')))

      let title = get('t')
      let text = get('x')
      if (!title) {
        const entry = (DATA.texts[locale] || {})[curseId]
        if (entry) {
          title = entry[0]
          text = entry[1 + level].split('{name}').join(victim)
        }
      }

      // textContent, не innerHTML: всё это пришло из адреса, набрать его может
      // кто угодно.
      const set = (id, value) => { document.getElementById(id).textContent = value }
      set('kicker', charm ? words.kickerCharm : words.kicker)
      if (charm) document.getElementById('kicker').classList.add('charm')
      set('victim', victim)
      set('title', title || '')
      set('text', text || '')
      set('reflect', charm ? words.reflectCharm : words.reflect)
      set('install', words.install)
      set('note', title ? words.note : words.unknown)
      if (!title) document.getElementById('card').classList.add('missing')

      document.getElementById('reflect').href = 'malocchio://reflect?' + params.toString()
      document.getElementById('install').href = DATA.install
    </script>
  </body>
</html>
