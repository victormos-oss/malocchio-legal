<!doctype html>

    <style>
      /*
        Страница ответного сглаза. Одна и без зависимостей, как политика
        рядом: её задача открыться с QR на любом телефоне за секунду.
        Шаблон, данные подставляет scripts/reflect-page.ts.
      */
      :root {
        --ink: #0b0a0c;
        --ink-raised: #141216;
        --brass: #c9a227;
        --brass-dim: #8a701a;
        --blood-text: #d6495c;
        --ash: #9a9298;
        --ash-dim: #857d85;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--ink); }
      body {
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
        color: var(--ash);
        font: 16px/1.55 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background:
          radial-gradient(60% 45% at 50% 30%, rgba(255, 154, 60, 0.12), transparent 70%),
          var(--ink);
      }
      main {
        width: 100%;
        max-width: 26rem;
        border: 1px solid var(--brass-dim);
        border-radius: 6px;
        padding: 1.75rem 1.25rem;
        background: rgba(20, 18, 22, 0.7);
        text-align: center;
      }
      .brand {
        margin: 0 0 1.25rem;
        font-size: 0.7rem;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: var(--brass);
      }
      .kicker {
        margin: 0;
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--blood-text);
      }
      .kicker.charm { color: var(--brass); }
      .victim {
        margin: 0.5rem 0 1rem;
        font: 600 2rem/1.15 Georgia, 'Times New Roman', serif;
        color: var(--ash);
        overflow-wrap: anywhere;
      }
      .title {
        margin: 0 0 0.5rem;
        font: 600 1.35rem/1.25 Georgia, 'Times New Roman', serif;
        color: var(--brass);
      }
      .text {
        margin: 0 0 1.5rem;
        font: italic 1.15rem/1.45 Georgia, 'Times New Roman', serif;
        color: var(--ash);
      }
      .actions { display: grid; gap: 0.75rem; }
      a.button {
        display: block;
        padding: 0.85rem 1rem;
        border-radius: 4px;
        text-decoration: none;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-size: 0.85rem;
        transition: transform 120ms ease, opacity 120ms ease;
      }
      a.button:active { transform: scale(0.98); opacity: 0.85; }
      a.primary { background: var(--brass); color: var(--ink); }
      a.secondary { border: 1px solid var(--brass); color: var(--brass); }
      a.button:focus-visible { outline: 2px solid var(--ash); outline-offset: 3px; }
      .note { margin: 1.25rem 0 0; font-size: 0.8rem; color: var(--ash-dim); }
      .hint {
        margin: 1rem 0 0;
        padding: 0.75rem;
        border: 1px solid var(--brass-dim);
        border-radius: 4px;
        font-size: 0.9rem;
        color: var(--ash);
      }
      .hint[hidden] { display: none; }
      .missing .curse { display: none; }
    </style>
  </head>
  <body>
    <main id="card">
      <p class="brand">Malocchio</p>

        <p class="text" id="text"></p>
      </div>
      <div class="actions">
        <a class="button primary" id="reflect" href="#"></a>
        <a class="button secondary" id="install" href="#"></a>
      </div>
      <p class="hint" id="hint" role="status" aria-live="polite" hidden></p>
      <p class="note" id="note"></p>
    </main>

аз на столик","Пусть все столики на вечер окажутся заняты.","Пусть последний освободится в 23:40.","Пусть кухня закроется в 23:45.","Пусть им принесут только хлеб.","Пусть хлеб окажется вчерашним, но за счёт заведения."],"wilting-bouquet":["Сглаз на букет","Пусть букет завянет к вечеру.","Пусть лепестки осыплются прямо в руках.","Пусть останутся одни шипы.","Пусть он попытается выдать это за задумку.","Пусть ему поверят, и пусть теперь каждый год ждут того же."],"heart-balloon":["Сглаз на шарик","Пусть шарик-сердце вырвется из рук.","Пусть улетит у всех на глазах.","Пусть зацепится за провода прямо под его окном.","Пусть провисит там до марта.","Пусть каждый вечер светится в свете фонаря."],"seen-no-reply":["Сглаз на «прочитано»","Пусть его сообщение прочитают и не ответят.","Пусть он увидит, что собеседник в сети.","Пусть тот напишет «печатает» и перестанет.","Пусть ответ придёт через три часа.","Пусть это будет стикер."],"couples-everywhere":["Сглаз на парочки","Пусть все лавочки в парке будут заняты парочками.","Пусть в кафе тоже.","Пусть его позовут сфотографировать чужую парочку.","Пусть попросят переснять ещё раз.","Пусть фото получится лучше, чем все его собственные за год."]},"en":{"diarrhea":["The Runs","May his stomach speak up at the quietest moment of the day.","May the nearest bathroom always be one floor up.","May the only bathroom on that floor be occupied, and not briefly.","May the person who walks out of that door be someone he knows.","May it be his boss, and may the boss say: \"{name}, you are next.\""],"sneeze":["The Sneeze","May his nose itch at the quietest point of the conversation.","May he sneeze three times in a row.","May it happen in an important meeting, in total silence.","May someone bless him louder than the room required.","May everyone turn around, and may that be his name from now on."],"hiccups":["The Hiccups","May he hiccup once and assume it is over.","May the hiccups return the moment he has something serious to say.","May they last exactly as long as he is speaking.","May everyone in the room offer their own cure.","May none of them work, and may it stop the second he gives up."],"belly-rumble":["The Rumbling Stomach","May his stomach quietly remind him it exists.","May it start its concert in the one silent minute.","May the sound be louder than a stomach has any right to be.","May everyone pretend they heard nothing.","May someone film it anyway, and may his stomach do an encore."],"damp-sock":["The Damp Sock","May his left sock be slightly damp.","May the source of the moisture never be found.","May he change socks, and may the new one get wet too.","May it happen at a house where shoes come off at the door.","May he leave a trail across the floor, and may the hosts say nothing."],"stuck-seed":["The Stuck Seed","May something small lodge between his teeth.","May his tongue fail to reach it.","May there be no toothpick in the entire building.","May he think about it all evening and about nothing else.","May it come out on its own three days later, once he has made peace with it."],"yawn":["The Yawn","May his eyes water in the middle of the afternoon.","May he yawn during an important meeting.","May the yawn land on the word \"engagement\".","May the speaker notice and look straight at him.","May someone ask him afterwards, in front of everyone, if he is getting enough rest."],"sleep-upside-down":["The Sleep Curse","May he want to lie down in the middle of the day.","May sleep refuse to come at night.","May his mind work better at three in the morning than it did all day.","May the best idea of his life arrive at 4:15 and be gone by breakfast.","May he fall asleep exactly ten minutes before the alarm."],"battery-one-percent":["The One Percent","May his phone be down to half by lunch.","May it survive longer at one percent than it did at twenty.","May the phone die at the exact moment he needs it.","May that moment be mid-route in a part of town he does not know.","May there be an outlet right there, and may the cable be at home."],"wifi-drop":["The Wi-Fi Curse","May the page take one second longer than usual.","May the connection drop at the best part.","May the connection come back the instant he no longer needs it.","May everyone else in the building be perfectly fine.","May the router blink green and pretend it had nothing to do with it."],"charger-wrong-side":["The Charger Curse","May the plug refuse to go in the first time.","May the plug fit neither way round.","May the right charger be in another room, a fact he does not know yet.","May the borrowed cable turn out to be the wrong connector.","May the one cable that fits be found, and may it not charge."],"autocorrect":["The Autocorrect Curse","May his phone fix one harmless letter.","May it fix the one word that should never have been touched.","May the message send before he can read it back.","May the message be read before he reaches \"edit\".","May the only reply be a screenshot of his own message."],"bluetooth-stranger":["The Bluetooth Curse","May his earbuds take a moment to connect.","May they connect to somebody else’s device.","May the device they land on be a speaker in a shared room.","May the thing playing be the thing he was never going to show anyone.","May the volume be at maximum and the pause button be nowhere he looks."],"update-before-talk":["The Update Curse","May the update remind him of itself at a bad time.","May the update start on its own.","May it start one minute before the presentation.","May the bar stop at forty-seven percent.","May \"do not turn off your computer\" stay on screen for exactly the length of his talk."],"third-password":["The Password Curse","May the right password not come to him at once.","May it come on the third attempt.","May the third attempt lock the account.","May the new password be refused for looking too much like the old one.","May the one that finally works be the first one he tried."],"wrong-screenshot":["The Screenshot Curse","May there be two near-identical screenshots in his gallery.","May he send the wrong one.","May he send it to the wrong person.","May the top of it show one line of somebody else’s chat.","May the reply be \"what is this?\", and may \"delete for everyone\" have expired."],"red-lights":["The Red Lights","May one light turn red just as he reaches it.","May every light on his route do the same.","May the next lane keep moving.","May he change lanes, and may the lane he left start moving.","May the last green arrive one second later than he needed it."],"jam-at-your-turn":["The Traffic Curse","May the road be clear right up to his turn.","May the jam begin where there is no longer an exit.","May the app offer a detour that is longer.","May he take the detour, and may the main road clear at once.","May the cause of the jam never be found: may there be nothing ahead at all."],"parking-just-missed":["The Parking Curse","May the nearest space be taken.","May he drive around the block.","May a space open thirty seconds after he leaves.","May he come back, and may it be taken again.","May he park two blocks away, and may it start raining there."],"every-floor":["The Elevator Curse","May the elevator take slightly longer than usual.","May it stop at every floor.","May there be nobody waiting at any of them.","May someone finally get in at the top and press the lobby.","May the doors open where he started, and may he have to step out."],"other-queue":["The Other Queue","May his line move slightly slower than the next one.","May the next one move three times faster.","May he switch to the fast one and end up last.","May his cashier call for a supervisor.","May the person who was behind him already be leaving with the bags."],"metro-doors":["The Closing Doors","May he reach the platform at the last second.","May the doors close right in front of him.","May the next train be eight minutes away.","May the next train arrive full.","May he see one empty seat through the window of the train pulling away."],"taxi-across-street":["The Taxi Curse","May the car take a while to arrive.","May the driver stop on the other side of the street.","May the crossing be two hundred metres away.","May the driver call while he is exactly in the middle of the road.","May the taxi turn around while he walks and stop where he was standing."],"escalator-closed":["The Escalator Curse","May the escalator run slower than usual.","May the one he needs be closed.","May the closed one be the one going up.","May the stairs beside it have forty steps.","May the exit he wanted turn out to have been downstairs."],"cold-coffee":["The Cold Coffee","May his coffee cool slightly faster than usual.","May it go cold one second before the first sip.","May the reheated cup taste wrong.","May the fresh one arrive as he is putting his coat on.","May the last mouthful be grounds."],"last-slice":["The Last Slice","May there be fewer slices left than he counted on.","May the last one be taken right in front of him.","May it be taken by the person who has already had two.","May he ask \"you are not having that, are you?\" and get no answer.","May one lettuce leaf be left on the plate, and may it be somebody else’s."],"ketchup-shot":["The Ketchup Curse","May nothing at all come out of the bottle at first.","May all of it come out at once after that.","May it land on something white.","May the stain be on his chest and not on his lap.","May water make it bigger and the napkin leave lint behind."],"pizza-temperature":["The Pizza Curse","May the first slice be hotter than it looks.","May it burn the roof of his mouth.","May the second slice already be cold by then.","May he keep touching the burnt spot with his tongue all evening.","May the cheese slide off in one sheet and land face down."],"empty-fridge":["The Empty Fridge","May the thing he came for not be in the fridge.","May he open it again a minute later.","May he open it five times, and may no food appear.","May the only edible thing be one day out of date.","May he smell it anyway, and may he eat it anyway."],"courier-in-shower":["The Doorbell Curse","May the courier arrive ahead of schedule.","May he call the minute the water comes on.","May he call exactly once.","May the door code in the app be the old one.","May the parcel be left with the neighbour who is never home."],"one-sip-left":["The Last Sip","May there be less in the bottle than he thought.","May exactly one mouthful remain.","May that mouthful be warm.","May the next bottle be the last one in the house.","May the shop across the road close three minutes before he gets there."],"chips-run-out":["The Empty Bag","May the bag turn out to be half air.","May it run out at the best part of the film.","May there be one crumb left at the bottom.","May the last crumb end up in the sofa.","May it be found a week later, and not by him."],"white-shirt-stain":["The White Shirt","May a small dot appear on the new white shirt.","May it appear within the first ten minutes.","May it be sauce and not water.","May it sit exactly where people look while talking to him.","May the wash make it paler and never make it go."],"loose-shoelace":["The Loose Lace","May the lace loosen after a hundred metres.","May it come undone completely.","May it happen in the middle of a crossing.","May the other one come undone the moment he ties the first.","May the end of the lace be wet."],"vanishing-keys":["The Vanishing Keys","May the keys be in the wrong pocket.","May they disappear for exactly seven minutes.","May he turn the whole flat over.","May they turn up in the most obvious place.","May that be the place he checked first."],"toilet-paper":["The Empty Roll","May the roll be thinner than it looked.","May it run out at the worst possible moment.","May the spare be in the cupboard behind the door.","May the cupboard be three steps away and those steps be impossible.","May there be somebody in the house he now has to call by name."],"unswattable-fly":["The Unswattable Fly","May one fly appear in the room.","May it circle him and nobody else.","May it land only where it cannot be swatted.","May it vanish the moment he picks up a newspaper.","May it come back at night and land on his forehead."],"night-mosquito":["The Night Mosquito","May a mosquito start up somewhere in the room.","May it exist only at night and only beside his ear.","May it be nowhere at all with the light on.","May it fall silent the second {name} closes his eyes.","May there be exactly one bite by morning, and may it be on his eyelid."],"tangled-earphones":["The Tangled Cord","May the cord twist slightly.","May it tangle in an empty pocket.","May the knot be where there are only two centimetres of cable.","May untangling it take exactly as long as the song he wanted.","May only the left one work afterwards."],"forgotten-word":["The Lost Word","May the word he needs arrive a second late.","May it vanish in the middle of the story.","May everyone go quiet and wait.","May someone helpfully suggest the wrong word.","May the real one come back at three in the morning, with nobody left to tell."],"low-fuel-light":["The Fuel Light","May the fuel light come on during the longest stretch of road.","May the nearest station be closed.","May the next one have a queue of three cars with trailers.","May the pump on his side be out of order, and may the filler cap be on the other.","May he pull out and see that the station across the road is cheaper."],"bird-on-hood":["The Pigeon Curse","May a pigeon mark his hood.","May it be a freshly washed hood.","May the next one land on the windshield, right at eye level.","May the washer tank be empty.","May the wipers spread it across the whole glass, and may the sun be straight ahead."],"car-alarm-night":["The Car Alarm","May the alarm go off for no reason.","May it happen at three in the morning.","May everyone in the building know whose car it is.","May the key fob be in the other jacket.","May the alarm stop on its own while he looks for the fob, and may it start again once he is back in bed."],"speed-bump":["The Speed Bump","May there be a speed bump where nobody expected one.","May there be no sign before it.","May a full cup of coffee be in the holder at that moment.","May something clank underneath.","May that something stay on the road, and may the mirror show exactly what it was."],"slow-truck":["The Slow Truck","May there be a truck ahead.","May the road be a single lane.","May the line be solid all the way to the horizon.","May a convoy come the other way at the first gap.","May there be a second truck ahead the moment he finally passes."],"check-engine":["The Check Engine Light","May an unfamiliar icon light up on the dashboard.","May it go out on the way to the garage.","May the garage say they found nothing.","May the icon come back on as he leaves the garage.","May the mechanic shrug and say it does that on all of them."],"navigator-lost":["The Navigator Curse","May the navigator lose the satellites at the interchange.","May it say “turn right” one second after the turn.","May it reroute him through the back streets.","May there be a barrier in the back streets.","May it announce “you have arrived” in front of a blank fence."],"tight-parking":["The Tight Parking","May someone park too close.","May it be on the driver’s side.","May he have to climb in through the passenger seat.","May a colleague walk past at that very moment.","May the neighbor drive away as soon as he is in."],"candy-bowl":["The Candy Curse","May the candy bowl hold nothing but hard mints.","May the mints be stuck together.","May the only chocolate turn out to be raisin.","May he eat it anyway, and may it have a nut in it too.","May the trick-or-treaters look into the bowl and walk away in silence."],"costume-fail":["The Costume Curse","May the costume get hot within ten minutes.","May the eyeholes slide sideways.","May someone else at the party wear the very same costume.","May theirs be better.","May everyone spend the evening mistaking him for the other one."],"pumpkin-rot":["The Pumpkin Curse","May the pumpkin carve a little crooked.","May its grin cave in.","May the candle inside go out with every breath of wind.","May the pumpkin slump sideways by morning.","May the neighbour’s pumpkin last until Christmas."],"jump-scare":["The Horror Movie Curse","May he jump at the most predictable moment.","May he spill the popcorn doing it.","May everyone in the room see.","May someone rewind and play it again.","May he spend half the night checking that the wardrobe door is shut."],"empty-doorbell":["The Doorbell Curse","May the doorbell ring while he is in the shower.","May he rush out in a towel.","May there be nobody at the door.","May it ring again exactly five minutes later.","May it turn out to be a cat that has learned to jump at the button."],"creaky-floor":["The Creaky Floor Curse","May one floorboard creak in the night.","May it be the one he just stepped on.","May another one creak in reply, one nobody stepped on.","May he switch on the light and find nothing.","May it turn out in the morning that the board only creaks at night."],"cobweb-face":["The Cobweb Curse","May he walk face first into a cobweb.","May it be invisible and endless.","May he feel it on his cheek all day.","May its owner turn up in his hood.","May he find out during a meeting."],"black-cat":["The Black Cat Curse","May a black cat cross his path.","May it come back and cross it again, to be sure.","May it sit in the middle of the pavement and refuse to be walked around.","May it follow him all the way home.","May it turn out at home that the cat now lives with him."],"lucky-ticket":["The Exam Charm","May the exam hand him a familiar question.","May it be the very one he managed to read.","May the examiner be in a good mood.","May the follow-up question be the one thing he knows best.","May the grade surprise even him."],"green-wave":["The Green Light Charm","May the first light turn green just as he reaches it.","May every light on his route do the same.","May the next lane stand still.","May the navigation app be surprised at how fast he got there.","May he arrive before he would have left on a normal day."],"parking-by-door":["The Parking Charm","May there be a free space right by the entrance.","May it be a wide one.","May the car in it pull out the very second he arrives.","May there be no puddles beside it.","May someone he likes take the space when he leaves."],"fast-queue":["The Queue Charm","May his queue move faster than the next one.","May a new till open and call him first.","May the cashier have change.","May a discount apply that he never knew about.","May someone in the other queue watch him leave with deep respect."],"full-battery":["The Battery Charm","May his phone last until evening.","May half the charge still be left by then.","May there be a charger at every socket he passes.","May the cable go in the right way the first time.","May his friends start asking him for a charger."],"sunny-weekend":["The Weekend Charm","May the weekend be sunny.","May the forecast rain pass them by.","May it rain again on Monday, since he is at work anyway.","May nobody call about work on Saturday.","May the weekend somehow turn out one day longer."],"hot-coffee":["The Hot Coffee Charm","May his coffee stay hot to the last sip.","May nobody interrupt him while he drinks it.","May there be a biscuit to go with it.","May it be the last biscuit, and may it go to him.","May the barista remember him and start adding a little more foam."],"found-keys":["The Keys Charm","May his keys always turn up on the first try.","May they be in the first pocket he checks.","May his glasses be there too.","May the remote be there as well.","May he finally learn where the other socks go."],"spilled-salt":["The Spilled Salt","May the salt cellar tip over.","May the salt spill right across the tablecloth.","May he throw a pinch over his shoulder and land it in the soup.","May it be someone else’s soup.","May the owner of the soup be deeply superstitious."],"fogged-mirror":["The Fogged Mirror","May the mirror fog up at the worst moment.","May he wipe it with his sleeve.","May it be the sleeve of a clean shirt.","May the mirror fog up again at once.","May he never find out what is on his forehead."],"under-ladder":["The Ladder Curse","May a ladder stand in his way.","May the only way round be through a puddle.","May he walk under it.","May a brush drop off it.","May the brush be full of blue paint, and may he be wearing white."],"indoor-umbrella":["The Umbrella Curse","May his umbrella pop open by itself in the hallway.","May it catch the shelf.","May the keys fall off and roll under the cupboard.","May the umbrella never close again.","May it not rain a single drop that day."],"spoken-luck":["The Knock on Wood","May he brag that everything is going well.","May there be nothing wooden nearby.","May he knock on a plastic table.","May everyone hear it.","May something break a minute later, and may everyone exchange looks."],"left-foot":["The Wrong Foot","May he get out of bed on the wrong foot.","May the foot miss the slipper.","May the floor be cold.","May the cat have the other slipper.","May the cat keep it until evening."],"salt-for-sugar":["The Sugar Bowl","May the sugar bowl be full of salt.","May he put in two spoonfuls.","May he find out on the first sip.","May it have been the last tea bag.","May he spend the day tasting the sugar with a fingertip first."],"white-back":["The Chalk on the Back","May someone tell him there is something on his back.","May he turn round.","May he turn round again, more slowly.","May there really be something on his back.","May it be chalk from the board he leaned on all meeting."],"rubber-spider":["The Rubber Spider","May a rubber spider sit on his mug.","May he not realise at once that it is rubber.","May he be holding coffee at that moment.","May the next spider be real.","May he no longer believe the real one."],"glued-coin":["The Glued Coin","May he spot a coin on the pavement.","May it be glued down.","May he try to pry it loose.","May a whole group be watching.","May the group be filming."],"whoopee-cushion":["The Whoopee Cushion","May there be a cushion with a surprise on his chair.","May he sit on it in front of everyone.","May it be louder than anyone expected.","May the room fall silent just then.","May someone quietly remove the cushion, leaving no evidence."],"swapped-keyboard":["The Keyboard Swap","May someone switch his keyboard language.","May he type half a page before he notices.","May autocorrect fix the rest into nonsense.","May the email go to his boss.","May his boss reply in kind."],"tangled-garland":["The Fairy Lights","May the lights come out of the box as one big knot.","May it take him an hour to untangle them.","May one bulb not light.","May the whole string stay dark because of it.","May it all light up just as he packs it back in the box."],"last-salad":["The Last Helping","May the festive salad run out before he gets there.","May one spoonful be left.","May it be the edge bit that is all peas.","May the second bowl turn up after midnight.","May it be given to the neighbours on New Year’s Day."],"gift-socks":["The Gift Socks","May he be given socks.","May he be given a second pair too.","May the third pair have reindeer on them.","May all three givers ask if he will wear them right now.","May he put them on, and may someone take a photo."],"missed-chimes":["The Midnight Chimes","May he start his wish a few chimes late.","May he not finish burning his wish note.","May the note not fit in the glass.","May he swallow it, ash and all.","May he forget the wish while he coughs."],"early-fireworks":["The Early Fireworks","May the neighbours start the fireworks three days early.","May it be at one in the morning every night.","May the loudest one go off under his window.","May they run out on New Year’s Eve itself.","May they start again on the second of January."],"tree-needles":["The Shedding Tree","May the tree start shedding on the second day.","May needles turn up in his slippers.","May they turn up in his bed too.","May there be more of them after the tree is gone.","May he find the last needle in July."],"our-song":["Our Song","May the cafe play the song from his last relationship.","May the next cafe play it too.","May the taxi radio pick it up.","May he start singing along without noticing.","May the driver join in with the harmony."],"booked-table":["The Booked Table","May every table for the evening be taken.","May the last one free up at 11:40 pm.","May the kitchen close at 11:45.","May they be served nothing but bread.","May the bread be yesterday’s, but on the house."],"wilting-bouquet":["The Wilting Bouquet","May the bouquet wilt by evening.","May the petals drop off in his hands.","May nothing be left but thorns.","May he pass it off as intentional.","May he be believed, and may the same be expected every year."],"heart-balloon":["The Heart Balloon","May the heart balloon slip from his hand.","May it float off in front of everyone.","May it snag on the wires right outside his window.","May it hang there until March.","May it glow under the street lamp every evening."],"seen-no-reply":["Seen, No Reply","May his message be read and left unanswered.","May he see that they are online.","May they start typing and stop.","May the reply come three hours later.","May it be a sticker."],"couples-everywhere":["Couples Everywhere","May every bench in the park be taken by couples.","May every cafe table too.","May a couple ask him to take their photo.","May they ask him to take it again.","May it turn out better than any photo of his own all year."]},"es":{"diarrhea":["El mal de la diarrea","Que le suene la tripa en el momento más tranquilo del día.","Que el baño más cercano esté siempre un piso más arriba.","Que el único baño de la planta esté ocupado, y para rato.","Que de esa puerta salga alguien a quien conoce en persona.","Que sea su jefe, y que le diga: «{name}, ahora te toca a ti»."],"sneeze":["El mal del estornudo","Que le pique la nariz en la parte más callada de la charla.","Que estornude tres veces seguidas.","Que ocurra en una reunión importante, en silencio absoluto.","Que alguien diga «salud» más alto de lo necesario.","Que se gire toda la sala, y que desde hoy lo llamen así."],"hiccups":["El mal del hipo","Que hipe una vez y crea que se ha librado.","Que el hipo vuelva justo cuando tenga que hablar en serio.","Que dure exactamente lo que dure su intervención.","Que cada persona de la sala le ofrezca su propio remedio.","Que ninguno funcione, y que se le pase solo en cuanto se calle."],"belly-rumble":["El mal de las tripas","Que el estómago le recuerde bajito que existe.","Que empiece el concierto en el único minuto de silencio.","Que suene más fuerte de lo que un estómago debería sonar.","Que todos disimulen como si no hubieran oído nada.","Que alguien lo grabe igualmente, y que el estómago repita."],"damp-sock":["El mal del calcetín húmedo","Que el calcetín izquierdo esté un poco húmedo.","Que nunca se sepa de dónde salió el agua.","Que se cambie de calcetines y el nuevo también se moje.","Que pase en una casa donde hay que descalzarse en la puerta.","Que deje un rastro de pisadas en el parqué y que nadie diga nada."],"stuck-seed":["El mal de la semilla","Que se le quede algo pequeño entre los dientes.","Que la lengua no llegue.","Que no haya un palillo en todo el edificio.","Que piense en eso toda la tarde y en nada más.","Que salga sola tres días después, cuando ya se haya resignado."],"yawn":["El mal del bostezo","Que le lloren los ojos a media tarde.","Que bostece en una reunión importante.","Que el bostezo caiga justo en la palabra «compromiso».","Que quien habla lo note y lo mire directamente.","Que al salir le pregunten delante de todos si duerme bien."],"sleep-upside-down":["El mal del sueño","Que le entre sueño a media tarde.","Que por la noche no le entre nada.","Que a las tres de la mañana la cabeza le funcione mejor que en todo el día.","Que la mejor idea de su vida llegue a las 4:15 y se pierda al amanecer.","Que se duerma exactamente diez minutos antes de que suene el despertador."],"battery-one-percent":["El mal del uno por ciento","Que el móvil esté a la mitad antes de comer.","Que aguante más al uno por ciento que al veinte.","Que el móvil se apague justo cuando hace falta.","Que sea a mitad de camino en un barrio que no conoce.","Que haya un enchufe al lado y el cable se haya quedado en casa."],"wifi-drop":["El mal del wifi","Que la página tarde un segundo más de lo normal.","Que se caiga la conexión en la mejor parte.","Que la conexión vuelva justo cuando ya da igual.","Que a los demás de la casa les funcione todo perfectamente.","Que el router parpadee en verde y haga como si no fuera con él."],"charger-wrong-side":["El mal del cargador","Que el cable no entre a la primera.","Que el cable no entre por ninguno de los dos lados.","Que el cargador bueno esté en otra habitación y él aún no lo sepa.","Que el cable prestado sea de otro conector.","Que aparezca el único que encaja y que no cargue."],"autocorrect":["El mal del autocorrector","Que el móvil le corrija una letra inofensiva.","Que le corrija justo la palabra que no había que tocar.","Que el mensaje salga antes de que pueda releerlo.","Que lean el mensaje antes de que llegue a «editar».","Que la única respuesta sea una captura de su propio mensaje."],"bluetooth-stranger":["El mal del bluetooth","Que los auriculares tarden en conectarse.","Que se conecten al aparato de otra persona.","Que el aparato al que se conecten sea el altavoz de una sala común.","Que esté sonando justo lo que no pensaba enseñarle a nadie.","Que el volumen esté al máximo y la pausa no esté donde la busca."],"update-before-talk":["El mal de la actualización","Que el sistema le recuerde la actualización en mal momento.","Que el sistema la empiece solo.","Que la empiece un minuto antes de la presentación.","Que la barra se quede en el cuarenta y siete por ciento.","Que el «no apague el equipo» dure justo lo que habría durado su charla."],"third-password":["El mal de la contraseña","Que la contraseña buena no le venga a la cabeza enseguida.","Que le venga al tercer intento.","Que al tercer intento se bloquee la cuenta.","Que el sistema rechace la nueva por parecerse demasiado a la vieja.","Que al final funcione la primera que probó."],"wrong-screenshot":["El mal de la captura","Que en la galería haya dos capturas casi idénticas.","Que mande la que no era.","Que se la mande a quien no era.","Que arriba se vea una línea de otra conversación.","Que le respondan «¿y esto?» y que «eliminar para todos» ya no funcione."],"red-lights":["El mal de los semáforos","Que un semáforo se ponga en rojo justo al llegar él.","Que hagan lo mismo todos los del trayecto.","Que el carril de al lado avance.","Que se cambie de carril y arranque el que acaba de dejar.","Que el último verde llegue un segundo más tarde de lo que necesitaba."],"jam-at-your-turn":["El mal del atasco","Que la carretera esté despejada justo hasta su salida.","Que el atasco empiece donde ya no se puede salir.","Que el navegador proponga un desvío más largo.","Que coja el desvío y que la vía principal se despeje al instante.","Que nunca se sepa la causa: que delante no haya absolutamente nada."],"parking-just-missed":["El mal del aparcamiento","Que el sitio más cercano esté ocupado.","Que dé una vuelta a la manzana.","Que quede libre treinta segundos después de que él se vaya.","Que vuelva y que se lo hayan cogido otra vez.","Que aparque a dos manzanas y que allí empiece a llover."],"every-floor":["El mal del ascensor","Que el ascensor tarde un poco más de lo normal.","Que pare en todas las plantas.","Que en ninguna haya nadie esperando.","Que en la última entre alguien y baje hasta el portal.","Que las puertas se abran donde empezó y que tenga que salir."],"other-queue":["El mal de la otra fila","Que su fila avance un poco más lenta que la de al lado.","Que la de al lado vaya tres veces más rápido.","Que se cambie a la rápida y quede el último.","Que en su caja llamen al encargado.","Que quien estaba detrás de él ya salga con la compra hecha."],"metro-doors":["El mal de las puertas","Que llegue al andén en el último segundo.","Que las puertas se cierren delante de sus narices.","Que el siguiente tren tarde ocho minutos.","Que el siguiente tren llegue lleno.","Que por la ventanilla del que se va vea un asiento libre que nadie ocupa."],"taxi-across-street":["El mal del taxi","Que el coche tarde en llegar.","Que el conductor pare en la acera de enfrente.","Que el paso de peatones esté a doscientos metros.","Que el conductor llame justo cuando él esté en mitad de la calzada.","Que el taxi dé la vuelta mientras camina y pare donde él estaba."],"escalator-closed":["El mal de la escalera mecánica","Que la escalera vaya más lenta de lo normal.","Que la que necesita esté cerrada.","Que la cerrada sea justo la de subida.","Que al lado haya una escalera de cuarenta peldaños.","Que arriba descubra que la salida buena estaba abajo."],"cold-coffee":["El mal del café frío","Que el café se enfríe un poco más rápido de lo normal.","Que se enfríe justo un segundo antes del primer sorbo.","Que recalentado sepa mal.","Que le traigan otro cuando ya se está poniendo el abrigo.","Que el último trago sea todo poso."],"last-slice":["El mal del último trozo","Que queden menos trozos de los que había contado.","Que el último se lo lleven delante de él.","Que se lo lleve quien ya se ha comido dos.","Que pregunte «no te lo vas a comer, ¿no?» y no le contesten.","Que en la bandeja quede una hoja de lechuga y que sea de otro."],"ketchup-shot":["El mal del kétchup","Que del bote no salga nada al principio.","Que después salga todo de golpe.","Que salga disparado hacia algo blanco.","Que la mancha caiga en el pecho y no en el pantalón.","Que el agua la haga más grande y la servilleta le deje pelusa."],"pizza-temperature":["El mal de la pizza","Que el primer trozo esté más caliente de lo que parece.","Que le queme el paladar.","Que el segundo trozo ya esté frío.","Que se toque la quemadura con la lengua toda la noche.","Que el queso se deslice entero y caiga boca abajo."],"empty-fridge":["El mal de la nevera","Que en la nevera no esté lo que venía a buscar.","Que la abra otra vez un minuto después.","Que la abra cinco veces y que no aparezca más comida.","Que lo único comestible esté caducado de ayer.","Que lo huela igualmente y se lo coma igualmente."],"courier-in-shower":["El mal del repartidor","Que el repartidor llegue antes de tiempo.","Que llame justo en el minuto en que se mete en la ducha.","Que llame una sola vez.","Que el código del portal en la aplicación sea el antiguo.","Que dejen el paquete en casa del vecino que nunca está."],"one-sip-left":["El mal del último trago","Que en la botella haya menos de lo que creía.","Que quede exactamente un trago.","Que ese trago esté caliente.","Que la siguiente botella sea la última de la casa.","Que la tienda de enfrente cierre tres minutos antes de que llegue."],"chips-run-out":["El mal de las patatas","Que la bolsa resulte estar medio vacía.","Que se acabe en la mejor parte de la película.","Que en el fondo quede una sola miga.","Que la última miga acabe en el sofá.","Que aparezca una semana después y que no la encuentre él."],"white-shirt-stain":["El mal de la mancha","Que en la camiseta blanca nueva aparezca un puntito.","Que aparezca en los primeros diez minutos.","Que sea salsa y no agua.","Que caiga justo donde mira la gente cuando habla con él.","Que el lavado la deje más clara y no la quite nunca."],"loose-shoelace":["El mal del cordón","Que el cordón se afloje a los cien metros.","Que se desate del todo.","Que pase en mitad de un paso de peatones.","Que el otro se desate en cuanto ate el primero.","Que la punta del cordón esté mojada."],"vanishing-keys":["El mal de las llaves","Que las llaves estén en el bolsillo equivocado.","Que desaparezcan exactamente siete minutos.","Que ponga la casa del revés.","Que aparezcan en el sitio más evidente.","Que sea el sitio que miró primero."],"toilet-paper":["El mal del papel","Que el rollo sea más fino de lo que parecía.","Que se acabe en el peor momento posible.","Que el de repuesto esté en el armario de detrás de la puerta.","Que el armario esté a tres pasos y que esos pasos no se puedan dar.","Que haya alguien en casa a quien ahora toca llamar por su nombre."],"unswattable-fly":["El mal de la mosca","Que aparezca una mosca en la habitación.","Que vuele solo alrededor de él.","Que se pose solo donde no se la puede aplastar.","Que desaparezca en cuanto coja el periódico.","Que vuelva de noche y se le pose en la frente."],"night-mosquito":["El mal del mosquito","Que en algún rincón empiece a sonar un mosquito.","Que exista solo de noche y solo junto a su oreja.","Que con la luz encendida no esté en ninguna parte.","Que se calle justo cuando {name} cierra los ojos.","Que por la mañana haya una sola picadura y que sea en el párpado."],"tangled-earphones":["El mal de los cascos","Que el cable se retuerza un poco.","Que se enrede hasta en un bolsillo vacío.","Que el nudo caiga donde solo hay dos centímetros de cable.","Que desenredarlo dure exactamente lo que dura la canción que quería.","Que después solo funcione el izquierdo."],"forgotten-word":["El mal de la palabra","Que la palabra que busca llegue un segundo tarde.","Que se le borre justo en mitad de la historia.","Que todos se callen y esperen.","Que alguien le sople una palabra que no es.","Que la buena vuelva a las tres de la mañana, sin nadie a quien contársela."],"low-fuel-light":["El mal de la reserva","Que el testigo de la reserva se encienda en el tramo más largo.","Que la gasolinera más cercana esté cerrada.","Que en la siguiente haya cola de tres coches con remolque.","Que el surtidor de su lado no funcione y la tapa del depósito esté en el otro.","Que al salir vea que la gasolinera de enfrente es más barata."],"bird-on-hood":["El mal de la paloma","Que una paloma le marque el capó.","Que sea un capó recién lavado.","Que la siguiente caiga en el parabrisas, justo a la altura de los ojos.","Que el depósito del limpiaparabrisas esté vacío.","Que las escobillas lo extiendan por todo el cristal y que el sol esté de frente."],"car-alarm-night":["El mal de la alarma","Que la alarma salte sin motivo.","Que sea a las tres de la madrugada.","Que todo el vecindario sepa de quién es el coche.","Que el mando esté en la otra chaqueta.","Que la alarma se calle sola mientras busca el mando y que vuelva a saltar cuando se acueste."],"speed-bump":["El mal del badén","Que haya un badén donde nadie lo esperaba.","Que no haya señal antes.","Que en ese momento lleve un café lleno en el posavasos.","Que algo suene debajo del coche.","Que ese algo se quede en la carretera y que por el espejo se vea qué era."],"slow-truck":["El mal del camión","Que delante vaya un camión.","Que la carretera sea de un solo carril.","Que la línea sea continua hasta el horizonte.","Que en el primer hueco venga una caravana de frente.","Que cuando por fin adelante, delante haya otro."],"check-engine":["El mal del testigo del motor","Que en el salpicadero se encienda un icono desconocido.","Que se apague de camino al taller.","Que en el taller digan que no han encontrado nada.","Que el icono vuelva a encenderse al salir del taller.","Que el mecánico se encoja de hombros y diga que eso lo hacen todos."],"navigator-lost":["El mal del navegador","Que el navegador pierda los satélites en el nudo de carreteras.","Que diga «gire a la derecha» un segundo después del giro.","Que recalcule la ruta por callejones.","Que en los callejones haya una barrera.","Que anuncie «ha llegado a su destino» delante de una tapia."],"tight-parking":["El mal del vecino de plaza","Que le aparquen demasiado cerca.","Que sea por el lado del conductor.","Que tenga que entrar por el asiento del copiloto.","Que en ese momento pase un compañero de trabajo.","Que en cuanto consiga entrar, el vecino se vaya."],"candy-bowl":["El mal de los caramelos","Que en el bol de caramelos solo queden los de menta.","Que los de menta estén pegados entre sí.","Que el único bombón resulte ser de pasas.","Que se lo coma igualmente y que además lleve nuez.","Que los niños del truco o trato miren el bol y se vayan sin decir nada."],"costume-fail":["El mal del disfraz","Que el disfraz dé calor a los diez minutos.","Que los agujeros de la máscara se tuerzan.","Que en la fiesta haya otra persona con el mismo disfraz.","Que el suyo sea mejor.","Que toda la noche le confundan con el otro."],"pumpkin-rot":["El mal de la calabaza","Que la calabaza quede un poco torcida al tallarla.","Que se le hunda la sonrisa.","Que la vela de dentro se apague con cada soplo de viento.","Que por la mañana la calabaza se haya desplomado de lado.","Que la del vecino aguante hasta Navidad."],"jump-scare":["El mal de la peli de miedo","Que se asuste en el momento más previsible.","Que se le caiga todo el bol de palomitas.","Que lo vea todo el mundo en el salón.","Que alguien rebobine y lo vuelva a poner.","Que se pase media noche comprobando que el armario está cerrado."],"empty-doorbell":["El mal del timbre","Que suene el timbre justo cuando está en la ducha.","Que salga corriendo con la toalla.","Que en la puerta no haya nadie.","Que vuelva a sonar exactamente cinco minutos después.","Que resulte ser un gato que ha aprendido a saltar al botón."],"creaky-floor":["El mal de la tabla que cruje","Que de noche cruja una tabla del suelo.","Que sea justo la que acaba de pisar.","Que le conteste otra que no ha pisado nadie.","Que encienda la luz y no haya nada.","Que por la mañana descubra que la tabla solo cruje de noche."],"cobweb-face":["El mal de la telaraña","Que se meta de cara en una telaraña.","Que sea invisible e interminable.","Que la note en la mejilla todo el día.","Que la dueña aparezca en su capucha.","Que lo descubra en plena reunión."],"black-cat":["El mal del gato negro","Que se le cruce un gato negro.","Que vuelva y se le cruce otra vez, por si acaso.","Que se siente en mitad de la acera y no le deje pasar.","Que le siga hasta casa.","Que en casa descubra que el gato ahora vive con él."],"lucky-ticket":["El amuleto del examen","Que en el examen le toque una pregunta conocida.","Que sea justo la que le dio tiempo a leer.","Que el profesor esté de buen humor.","Que la pregunta extra sea lo que mejor sabe.","Que la nota le sorprenda hasta a él."],"green-wave":["El amuleto del semáforo en verde","Que el primer semáforo se ponga en verde justo al llegar él.","Que hagan lo mismo todos los del trayecto.","Que el carril de al lado se quede parado.","Que hasta el navegador se sorprenda de lo rápido que ha llegado.","Que llegue antes de lo que saldría un día normal."],"parking-by-door":["El amuleto del aparcamiento","Que haya un sitio libre justo al lado de la entrada.","Que sea amplio.","Que el coche que lo ocupa se vaya en el segundo en que llegue él.","Que no haya charcos al lado.","Que al irse lo ocupe alguien que le cae bien."],"fast-queue":["El amuleto de la cola","Que su cola avance más rápido que la de al lado.","Que abran una caja nueva y le llamen a él primero.","Que la cajera tenga cambio.","Que le apliquen un descuento que ni conocía.","Que alguien de la otra cola le mire salir con profundo respeto."],"full-battery":["El amuleto de la batería","Que el móvil le aguante hasta la noche.","Que a esa hora aún le quede la mitad.","Que haya un cargador en cada enchufe por el que pase.","Que el cable entre del lado bueno a la primera.","Que sean sus amigos los que le pidan el cargador a él."],"sunny-weekend":["El amuleto del fin de semana","Que el fin de semana salga el sol.","Que la lluvia del pronóstico pase de largo.","Que vuelva a llover el lunes, total, ya está trabajando.","Que el sábado nadie le llame por trabajo.","Que el fin de semana, sin saber por qué, dure un día más."],"hot-coffee":["El amuleto del café caliente","Que el café esté caliente hasta el último sorbo.","Que nadie le interrumpa mientras se lo toma.","Que haya una galleta para acompañarlo.","Que sea la última y le toque a él.","Que el barista le reconozca y empiece a ponerle más espuma."],"found-keys":["El amuleto de las llaves","Que las llaves aparezcan siempre a la primera.","Que estén en el primer bolsillo que mire.","Que las gafas estén ahí también.","Que el mando de la tele también.","Que por fin descubra adónde van los calcetines desparejados."],"spilled-salt":["El mal de la sal","Que se vuelque el salero.","Que la sal se derrame por todo el mantel.","Que eche un pellizco por encima del hombro y caiga en la sopa.","Que la sopa sea de otro.","Que el dueño de la sopa sea muy supersticioso."],"fogged-mirror":["El mal del espejo","Que el espejo se empañe en el peor momento.","Que lo limpie con la manga.","Que sea la manga de una camisa limpia.","Que el espejo se vuelva a empañar al instante.","Que nunca llegue a ver qué tiene en la frente."],"under-ladder":["El mal de la escalera","Que haya una escalera en su camino.","Que la única forma de rodearla sea por un charco.","Que pase por debajo.","Que se caiga una brocha.","Que la brocha tenga pintura azul y él vaya de blanco."],"indoor-umbrella":["El mal del paraguas","Que el paraguas se abra solo en el recibidor.","Que golpee la estantería.","Que se caigan las llaves y rueden bajo el armario.","Que el paraguas no vuelva a cerrarse.","Que ese día no caiga ni una gota."],"spoken-luck":["El mal de tocar madera","Que presuma de que todo le va bien.","Que no haya nada de madera cerca.","Que toque una mesa de plástico.","Que lo oiga todo el mundo.","Que al minuto se le rompa algo y todos se miren."],"left-foot":["El mal del pie izquierdo","Que se levante con el pie izquierdo.","Que el pie no acierte con la zapatilla.","Que el suelo esté helado.","Que la otra zapatilla la tenga el gato.","Que el gato no la devuelva hasta la noche."],"salt-for-sugar":["El mal del azucarero","Que en el azucarero haya sal.","Que eche dos cucharadas.","Que se dé cuenta al primer sorbo.","Que fuera la última bolsita de té.","Que pase el día probando el azúcar con la punta del dedo."],"white-back":["El mal de la espalda","Que le digan que lleva algo en la espalda.","Que se dé la vuelta.","Que se vuelva otra vez, más despacio.","Que de verdad lleve algo en la espalda.","Que sea la tiza de la pizarra en la que se apoyó toda la reunión."],"rubber-spider":["El mal de la araña","Que en su taza haya una araña de goma.","Que tarde en darse cuenta de que es de goma.","Que en ese momento tenga el café en la mano.","Que la siguiente araña sea de verdad.","Que a la de verdad ya no se la crea."],"glued-coin":["El mal de la moneda","Que vea una moneda en la acera.","Que esté pegada.","Que intente despegarla.","Que lo esté mirando un grupo entero.","Que el grupo lo esté grabando."],"whoopee-cushion":["El mal del cojín","Que en su silla haya un cojín con sorpresa.","Que se siente encima delante de todos.","Que suene más fuerte de lo que nadie esperaba.","Que justo entonces se haga el silencio.","Que alguien retire el cojín en silencio y no quede ninguna prueba."],"swapped-keyboard":["El mal del teclado","Que le cambien el idioma del teclado.","Que escriba media página antes de darse cuenta.","Que el autocorrector arregle el resto a su manera.","Que el correo le llegue al jefe.","Que el jefe conteste igual."],"tangled-garland":["El mal de la guirnalda","Que la guirnalda salga de la caja hecha un ovillo.","Que tarde una hora en desenredarla.","Que una bombilla no encienda.","Que por culpa de ella no encienda ninguna.","Que se encienda justo cuando la vuelva a guardar."],"last-salad":["El mal de la ensaladilla","Que la ensaladilla se acabe antes de que llegue.","Que quede una cucharada.","Que sea la del borde, solo guisantes.","Que la segunda fuente aparezca pasada la medianoche.","Que el día de Año Nuevo se la den a los vecinos."],"gift-socks":["El mal del regalo","Que le regalen calcetines.","Que le regalen otro par.","Que el tercero lleve renos.","Que los tres le pregunten si se los va a poner ya.","Que se los ponga y que le hagan una foto."],"missed-chimes":["El mal de las campanadas","Que empiece a pedir el deseo tarde.","Que no le dé tiempo a comerse las uvas.","Que se le atragante la última.","Que brinde con la boca llena.","Que se le olvide el deseo mientras tose."],"early-fireworks":["El mal de los petardos","Que los vecinos empiecen con los petardos tres días antes.","Que sea cada noche a la una.","Que el más fuerte explote bajo su ventana.","Que en Nochevieja ya no les quede ninguno.","Que el dos de enero vuelvan a empezar."],"tree-needles":["El mal del árbol","Que el árbol empiece a soltar agujas al segundo día.","Que aparezcan agujas en las zapatillas.","Que también en la cama.","Que haya aún más cuando saquen el árbol.","Que encuentre la última aguja en julio."],"our-song":["El mal de nuestra canción","Que en la cafetería suene la canción de su ex.","Que en la siguiente también.","Que la radio del taxi la ponga.","Que empiece a cantarla sin darse cuenta.","Que el taxista le haga la segunda voz."],"booked-table":["El mal de la mesa","Que todas las mesas de la noche estén reservadas.","Que la última quede libre a las 23:40.","Que la cocina cierre a las 23:45.","Que solo les traigan pan.","Que el pan sea de ayer, pero invita la casa."],"wilting-bouquet":["El mal del ramo","Que el ramo se marchite antes de la noche.","Que los pétalos se le caigan en la mano.","Que solo queden espinas.","Que intente hacerlo pasar por idea suya.","Que se lo crean y que ahora lo esperen cada año."],"heart-balloon":["El mal del globo","Que el globo de corazón se le escape.","Que salga volando delante de todos.","Que se enganche en los cables justo frente a su ventana.","Que se quede allí hasta marzo.","Que cada noche brille bajo la farola."],"seen-no-reply":["El mal del visto","Que lean su mensaje y no contesten.","Que vea que está en línea.","Que ponga «escribiendo» y pare.","Que la respuesta llegue tres horas después.","Que sea un sticker."],"couples-everywhere":["El mal de las parejitas","Que todos los bancos del parque estén ocupados por parejas.","Que las mesas de las cafeterías también.","Que una pareja le pida que les haga una foto.","Que le pidan repetirla.","Que la foto salga mejor que cualquiera de las suyas en todo el año."]},"it":{"diarrhea":["Il malocchio della diarrea","Che la pancia gli brontoli nel momento più tranquillo della giornata.","Che il bagno più vicino sia sempre al piano di sopra.","Che l'unico bagno del piano sia occupato, e per un bel pezzo.","Che da quella porta esca qualcuno che conosce di persona.","Che sia il suo capo, e che gli dica: «{name}, adesso tocca a te»."],"sneeze":["Il malocchio dello starnuto","Che gli pizzichi il naso nel punto più silenzioso del discorso.","Che starnutisca tre volte di fila.","Che succeda a una riunione importante, nel silenzio più totale.","Che qualcuno dica «salute» più forte del necessario.","Che si giri tutta la sala, e che da quel giorno lo chiamino «Salute»."],"hiccups":["Il malocchio del singhiozzo","Che gli venga il singhiozzo una volta sola e che si creda salvo.","Che il singhiozzo torni proprio quando deve parlare sul serio.","Che duri esattamente quanto il suo intervento.","Che ogni persona in sala gli suggerisca il suo rimedio della nonna.","Che non ne funzioni nessuno, e che passi da solo appena smette di parlare."],"belly-rumble":["Il malocchio della pancia che brontola","Che lo stomaco gli ricordi sottovoce di esistere.","Che il concerto cominci nell'unico minuto di silenzio.","Che suoni più forte di quanto uno stomaco dovrebbe poter suonare.","Che tutti facciano finta di non aver sentito niente.","Che qualcuno lo registri comunque, e che lo stomaco conceda il bis."],"damp-sock":["Il malocchio del calzino umido","Che il calzino sinistro sia leggermente umido.","Che non si scopra mai da dove sia arrivata l'acqua.","Che cambi calzini e che si bagni anche quello nuovo.","Che succeda in una casa dove bisogna togliersi le scarpe all'ingresso.","Che lasci una scia di impronte sul parquet e che nessuno dica niente."],"stuck-seed":["Il malocchio del semino tra i denti","Che gli resti qualcosa di piccolo tra i denti.","Che la lingua non ci arrivi.","Che in tutto il palazzo non si trovi uno stuzzicadenti.","Che ci pensi tutto il pomeriggio, e a nient'altro.","Che esca da solo tre giorni dopo, quando ormai ci ha fatto l'abitudine."],"yawn":["Il malocchio dello sbadiglio","Che gli lacrimino gli occhi a metà pomeriggio.","Che sbadigli durante una riunione importante.","Che lo sbadiglio cada proprio sulla parola «priorità».","Che chi sta parlando se ne accorga e lo guardi dritto negli occhi.","Che all'uscita gli chiedano davanti a tutti se dorme abbastanza."],"sleep-upside-down":["Il malocchio del sonno","Che gli venga sonno a metà pomeriggio.","Che di notte non gli venga per niente.","Che alle tre di notte la testa gli funzioni meglio che in tutta la giornata.","Che l'idea della sua vita arrivi alle 4:15 e svanisca all'alba.","Che si addormenti esattamente dieci minuti prima che suoni la sveglia."],"battery-one-percent":["Il malocchio dell'uno per cento","Che il telefono sia a metà batteria prima di pranzo.","Che all'uno per cento duri più che al venti.","Che si spenga proprio quando serve.","Che succeda a metà strada, in un quartiere che non conosce.","Che accanto ci sia una presa libera e che il cavo sia rimasto a casa."],"wifi-drop":["Il malocchio del Wi-Fi","Che la pagina ci metta un secondo più del solito.","Che la connessione salti sul più bello.","Che torni proprio quando ormai non serve più.","Che agli altri in casa funzioni tutto alla perfezione.","Che il router lampeggi verde e faccia finta di niente."],"charger-wrong-side":["Il malocchio del caricabatterie","Che il cavo non entri al primo colpo.","Che non entri né da un verso né dall'altro.","Che il caricabatterie buono sia in un'altra stanza, e che lui ancora non lo sappia.","Che il cavo prestato abbia l'attacco sbagliato.","Che salti fuori l'unico che entra, e che non carichi."],"autocorrect":["Il malocchio del correttore","Che il telefono gli corregga una lettera innocente.","Che corregga proprio la parola che non andava toccata.","Che il messaggio parta prima che possa rileggerlo.","Che lo leggano prima che lui arrivi a «Modifica».","Che l'unica risposta sia uno screenshot del suo stesso messaggio."],"bluetooth-stranger":["Il malocchio del Bluetooth","Che gli auricolari ci mettano un po' a collegarsi.","Che si colleghino a un dispositivo che non è il suo.","Che quel dispositivo sia la cassa della sala comune.","Che stia suonando proprio quello che non voleva far sentire a nessuno.","Che il volume sia al massimo e che la pausa non sia dove la cerca."],"update-before-talk":["Il malocchio dell'aggiornamento","Che il computer gli ricordi l'aggiornamento nel momento sbagliato.","Che l'aggiornamento parta da solo.","Che parta un minuto prima della presentazione.","Che la barra si fermi al quarantasette per cento.","Che il «Non spegnere il computer» duri esattamente quanto il suo intervento."],"third-password":["Il malocchio della password","Che la password giusta non gli torni subito in mente.","Che gli torni al terzo tentativo.","Che al terzo tentativo l'account si blocchi.","Che il sistema rifiuti quella nuova perché troppo simile alla vecchia.","Che alla fine funzioni la prima che aveva provato."],"wrong-screenshot":["Il malocchio dello screenshot","Che in galleria ci siano due screenshot quasi identici.","Che mandi quello sbagliato.","Che lo mandi alla persona sbagliata.","Che in alto si veda una riga di un'altra chat.","Che gli rispondano «e questo?» e che «Elimina per tutti» non funzioni più."],"red-lights":["Il malocchio del semaforo","Che il semaforo diventi rosso proprio quando arriva lui.","Che facciano lo stesso tutti quelli sul suo percorso.","Che la corsia accanto scorra.","Che cambi corsia e che parta quella che ha appena lasciato.","Che l'ultimo verde arrivi un secondo dopo quello che gli serviva."],"jam-at-your-turn":["Il malocchio della coda","Che la tangenziale sia libera proprio fino alla sua uscita.","Che la coda cominci dove ormai non si può più uscire.","Che il navigatore proponga una deviazione più lunga.","Che prenda la deviazione e che la strada principale si liberi all'istante.","Che non si sappia mai il perché, e che davanti non ci sia assolutamente niente."],"parking-just-missed":["Il malocchio del parcheggio","Che il posto più vicino sia occupato.","Che debba fare il giro dell'isolato.","Che il posto si liberi trenta secondi dopo il suo passaggio.","Che torni indietro e che glielo abbiano già preso di nuovo.","Che parcheggi a due isolati e che lì cominci a piovere."],"every-floor":["Il malocchio dell'ascensore","Che l'ascensore ci metta un po' più del solito.","Che si fermi a tutti i piani.","Che a nessun piano ci sia qualcuno ad aspettare.","Che all'ultimo salga qualcuno che deve scendere al piano terra.","Che le porte si riaprano al piano da cui è partito, e che gli tocchi uscire."],"other-queue":["Il malocchio dell'altra fila","Che la sua fila vada un po' più piano di quella accanto.","Che quella accanto vada tre volte più veloce.","Che passi a quella veloce e che si ritrovi ultimo.","Che alla sua cassa chiamino il responsabile.","Che chi era dietro di lui esca già con la spesa fatta."],"metro-doors":["Il malocchio delle porte","Che arrivi sul binario all'ultimo secondo.","Che le porte gli si chiudano davanti al naso.","Che la metro successiva arrivi tra otto minuti.","Che arrivi piena come un uovo.","Che dal finestrino di quella che parte veda un posto libero che nessuno occupa."],"taxi-across-street":["Il malocchio del taxi","Che la macchina ci metta un po' ad arrivare.","Che il tassista si fermi sul marciapiede opposto.","Che le strisce pedonali siano a duecento metri.","Che il tassista lo chiami proprio mentre è in mezzo alla carreggiata.","Che il taxi faccia inversione mentre lui attraversa, e si fermi dove era lui."],"escalator-closed":["Il malocchio della scala mobile","Che la scala mobile vada più lenta del solito.","Che quella che gli serve sia ferma.","Che sia ferma proprio quella in salita.","Che accanto ci sia una scala di quaranta gradini.","Che in cima scopra che l'uscita giusta era di sotto."],"cold-coffee":["Il malocchio del caffè freddo","Che il caffè si raffreddi un po' più in fretta del normale.","Che si raffreddi un secondo prima del primo sorso.","Che riscaldato sappia di bruciato.","Che gliene portino un altro quando si sta già mettendo il cappotto.","Che l'ultimo sorso sia tutto fondo, con lo zucchero che non si è sciolto."],"last-slice":["Il malocchio dell'ultima fetta","Che le fette siano meno di quelle che aveva contato.","Che l'ultima gliela prendano sotto gli occhi.","Che la prenda chi ne ha già mangiate due.","Che chieda «non la mangi, vero?» e che nessuno risponda.","Che sul vassoio resti una foglia di basilico, e che sia già prenotata."],"ketchup-shot":["Il malocchio del ketchup","Che dal flacone all'inizio non esca niente.","Che poi esca tutto in una volta.","Che schizzi dritto su qualcosa di bianco.","Che la macchia finisca sul petto e non sui pantaloni.","Che l'acqua la allarghi e che il tovagliolo ci lasci i pelucchi."],"pizza-temperature":["Il malocchio della pizza","Che la prima fetta sia più calda di quanto sembri.","Che gli bruci il palato.","Che la seconda fetta sia già fredda.","Che passi tutta la sera a tastarsi la scottatura con la lingua.","Che la mozzarella scivoli via tutta intera e cada a faccia in giù."],"empty-fridge":["Il malocchio del frigo","Che nel frigo non ci sia quello che cercava.","Che lo riapra un minuto dopo.","Che lo apra cinque volte e che il cibo non aumenti.","Che l'unica cosa commestibile sia scaduta ieri.","Che la annusi lo stesso, e che la mangi lo stesso."],"courier-in-shower":["Il malocchio del corriere","Che il corriere arrivi in anticipo.","Che suoni proprio nel minuto in cui entra in doccia.","Che suoni una volta sola.","Che nell'app ci sia ancora il vecchio nome sul citofono.","Che il pacco venga lasciato al vicino che non c'è mai."],"one-sip-left":["Il malocchio dell'ultimo sorso","Che nella bottiglia ce ne sia meno di quanto pensava.","Che ne resti esattamente un sorso.","Che quel sorso sia caldo.","Che la bottiglia successiva sia l'ultima in casa.","Che il negozio di fronte chiuda tre minuti prima che arrivi."],"chips-run-out":["Il malocchio delle patatine","Che il sacchetto si riveli mezzo vuoto.","Che finisca sul più bello del film.","Che sul fondo resti una briciola sola.","Che l'ultima briciola finisca tra i cuscini del divano.","Che salti fuori una settimana dopo, e che a trovarla non sia lui."],"white-shirt-stain":["Il malocchio della macchia","Che sulla maglietta bianca nuova compaia un puntino.","Che compaia nei primi dieci minuti.","Che sia sugo, e non acqua.","Che finisca proprio dove la gente guarda quando gli parla.","Che il lavaggio la schiarisca e non la tolga mai."],"loose-shoelace":["Il malocchio della stringa","Che la stringa si allenti dopo cento metri.","Che si slacci del tutto.","Che succeda in mezzo alle strisce pedonali.","Che l'altra si slacci appena ha allacciato la prima.","Che la punta della stringa sia bagnata."],"vanishing-keys":["Il malocchio delle chiavi","Che le chiavi siano nella tasca sbagliata.","Che spariscano per sette minuti esatti.","Che metta a soqquadro tutta la casa.","Che ricompaiano nel posto più ovvio.","Che sia il primo posto in cui aveva guardato."],"toilet-paper":["Il malocchio della carta igienica","Che il rotolo sia più sottile di quanto sembrava.","Che finisca nel momento peggiore.","Che quello di scorta sia nell'armadietto dietro la porta.","Che l'armadietto sia a tre passi, e che quei passi non si possano fare.","Che in casa ci sia qualcuno, e che adesso tocchi chiamarlo per nome."],"unswattable-fly":["Il malocchio della mosca","Che in stanza entri una mosca.","Che voli solo intorno a lui.","Che si posi solo dove non si può schiacciare.","Che sparisca appena prende in mano il giornale.","Che torni di notte e che gli si posi sulla fronte."],"night-mosquito":["Il malocchio della zanzara","Che da qualche parte cominci a ronzare una zanzara.","Che esista solo di notte e solo vicino al suo orecchio.","Che con la luce accesa non sia da nessuna parte.","Che si zittisca appena {name} accende la luce, e riprenda appena la spegne.","Che al mattino ci sia una puntura sola, e che sia sulla palpebra."],"tangled-earphones":["Il malocchio delle cuffiette","Che il filo si attorcigli un pochino.","Che si aggrovigli anche in una tasca vuota.","Che il nodo venga dove ci sono solo due centimetri di filo.","Che scioglierlo duri esattamente quanto la canzone che voleva sentire.","Che poi funzioni solo la cuffietta sinistra."],"forgotten-word":["Il malocchio della parola","Che la parola che cerca arrivi con un secondo di ritardo.","Che gli sparisca proprio a metà racconto.","Che tutti tacciano e aspettino.","Che qualcuno gli suggerisca la parola sbagliata.","Che quella giusta torni alle tre di notte, senza nessuno a cui dirla."],"low-fuel-light":["Il malocchio della riserva","Che la spia della riserva si accenda nel tratto più lungo.","Che il distributore più vicino sia chiuso.","Che al successivo ci sia la fila di tre macchine con la roulotte.","Che la pompa dal suo lato non funzioni e che il bocchettone sia dall'altro.","Che uscendo veda che il distributore di fronte costa meno."],"bird-on-hood":["Il malocchio del piccione","Che un piccione gli battezzi il cofano.","Che sia un cofano appena lavato.","Che il prossimo centri il parabrezza, proprio all'altezza degli occhi.","Che il serbatoio del lavavetri sia vuoto.","Che i tergicristalli lo spalmino su tutto il vetro, col sole di fronte."],"car-alarm-night":["Il malocchio dell'antifurto","Che l'antifurto scatti senza motivo.","Che sia alle tre di notte.","Che tutto il condominio sappia di chi è la macchina.","Che il telecomando sia nell'altra giacca.","Che l'allarme si zittisca da solo mentre cerca il telecomando, e riparta appena torna a letto."],"speed-bump":["Il malocchio del dosso","Che ci sia un dosso dove nessuno se l'aspettava.","Che prima non ci sia nessun cartello.","Che in quel momento abbia un caffè pieno nel portabicchieri.","Che sotto la macchina qualcosa faccia rumore.","Che quel qualcosa resti sull'asfalto, e che dallo specchietto si veda cos'era."],"slow-truck":["Il malocchio del camion","Che davanti a lui ci sia un camion.","Che la strada sia a una corsia sola.","Che la linea continua arrivi fino all'orizzonte.","Che al primo varco arrivi una colonna in senso opposto.","Che quando finalmente sorpassa, davanti ce ne sia un altro."],"check-engine":["Il malocchio della spia del motore","Che sul cruscotto si accenda una spia mai vista.","Che si spenga mentre va dal meccanico.","Che in officina dicano di non aver trovato niente.","Che la spia si riaccenda appena esce dall'officina.","Che il meccanico allarghi le braccia e dica che lo fanno tutte."],"navigator-lost":["Il malocchio del navigatore","Che il navigatore perda il segnale proprio allo svincolo.","Che dica «svolta a destra» un secondo dopo la svolta.","Che ricalcoli il percorso per i vicoli.","Che nei vicoli ci sia una sbarra.","Che annunci «sei arrivato a destinazione» davanti a un muro."],"tight-parking":["Il malocchio del vicino di parcheggio","Che gli parcheggino troppo vicino.","Che sia dal lato del guidatore.","Che debba entrare dal lato del passeggero.","Che in quel momento passi un collega.","Che appena riesce a entrare, il vicino se ne vada."],"candy-bowl":["Il malocchio delle caramelle","Che nella ciotola restino solo le caramelle alla menta.","Che quelle alla menta siano appiccicate tra loro.","Che l'unico cioccolatino si riveli all'uvetta.","Che lo mangi lo stesso, e che dentro ci sia pure la noce.","Che i bambini del dolcetto o scherzetto guardino la ciotola e se ne vadano senza dire niente."],"costume-fail":["Il malocchio del costume","Che dopo dieci minuti il costume faccia caldo.","Che i buchi della maschera si spostino.","Che alla festa ci sia qualcun altro con lo stesso costume.","Che il suo sia più bello.","Che per tutta la sera lo scambino per l'altro."],"pumpkin-rot":["Il malocchio della zucca","Che la zucca gli venga un po' storta.","Che il sorriso le si afflosci.","Che la candela dentro si spenga a ogni soffio di vento.","Che la mattina dopo la zucca sia crollata su un fianco.","Che quella del vicino resista fino a Natale."],"jump-scare":["Il malocchio del film horror","Che si spaventi nel momento più prevedibile.","Che gli cada tutta la ciotola di popcorn.","Che lo veda tutto il salotto.","Che qualcuno torni indietro e rimetta la scena.","Che passi mezza notte a controllare che l'armadio sia chiuso."],"empty-doorbell":["Il malocchio del campanello","Che suonino al campanello proprio mentre è sotto la doccia.","Che corra ad aprire con l'asciugamano.","Che alla porta non ci sia nessuno.","Che risuonino esattamente cinque minuti dopo.","Che si scopra che è un gatto che ha imparato a saltare sul pulsante."],"creaky-floor":["Il malocchio dell'asse che scricchiola","Che di notte scricchioli un'asse del pavimento.","Che sia proprio quella che ha appena calpestato.","Che le risponda un'altra che non ha calpestato nessuno.","Che accenda la luce e che non ci sia niente.","Che al mattino scopra che quell'asse scricchiola solo di notte."],"cobweb-face":["Il malocchio della ragnatela","Che finisca con la faccia dentro una ragnatela.","Che sia invisibile e infinita.","Che se la senta sulla guancia per tutto il giorno.","Che la proprietaria spunti dal suo cappuccio.","Che se ne accorga in piena riunione."],"black-cat":["Il malocchio del gatto nero","Che un gatto nero gli attraversi la strada.","Che torni indietro e gliela riattraversi, per sicurezza.","Che si sieda in mezzo al marciapiede e non lo lasci passare.","Che lo segua fino a casa.","Che a casa scopra che adesso il gatto vive con lui."],"lucky-ticket":["L'amuleto dell'esame","Che all'esame gli capiti una domanda che conosce.","Che sia proprio l'unica che ha fatto in tempo a ripassare.","Che il professore sia di buon umore.","Che la domanda in più sia quella che sa meglio.","Che esca con un trenta e lode che sorprenda perfino lui."],"green-wave":["L'amuleto dell'onda verde","Che il primo semaforo diventi verde proprio quando arriva lui.","Che facciano lo stesso tutti quelli sul suo percorso.","Che la corsia accanto resti ferma.","Che perfino il navigatore si stupisca di quanto è stato veloce.","Che arrivi prima di quando partirebbe in un giorno normale."],"parking-by-door":["L'amuleto del parcheggio","Che ci sia un posto libero proprio davanti all'ingresso.","Che sia bello largo.","Che la macchina che lo occupa se ne vada nell'istante in cui arriva lui.","Che accanto non ci siano pozzanghere.","Che quando riparte lo prenda qualcuno che gli sta simpatico."],"fast-queue":["L'amuleto della fila","Che la sua fila vada più veloce di quella accanto.","Che aprano una cassa nuova e chiamino lui per primo.","Che la cassiera abbia il resto.","Che gli facciano uno sconto di cui non sapeva niente.","Che qualcuno dell'altra fila lo guardi uscire con profondo rispetto."],"full-battery":["L'amuleto della batteria","Che il telefono gli arrivi fino a sera.","Che a quell'ora sia ancora a metà.","Che ci sia un caricabatterie a ogni presa che incontra.","Che il cavo entri dal verso giusto al primo colpo.","Che siano gli amici a chiedere il caricabatterie a lui."],"sunny-weekend":["L'amuleto del weekend","Che nel weekend ci sia il sole.","Che la pioggia delle previsioni passi oltre.","Che torni a piovere il lunedì, tanto ormai è in ufficio.","Che il sabato nessuno lo chiami per lavoro.","Che il weekend, senza sapere perché, duri un giorno in più."],"hot-coffee":["L'amuleto del caffè caldo","Che il caffè resti caldo fino all'ultimo sorso.","Che nessuno lo interrompa mentre lo beve.","Che ci sia un cornetto ad accompagnarlo.","Che sia l'ultimo cornetto, e che tocchi a lui.","Che il barista lo riconosca e gli prepari «il solito» senza chiedere."],"found-keys":["L'amuleto delle chiavi","Che le chiavi saltino fuori sempre al primo colpo.","Che siano nella prima tasca in cui guarda.","Che lì ci siano anche gli occhiali.","Che ci sia pure il telecomando.","Che scopra finalmente dove vanno a finire i calzini spaiati."],"spilled-salt":["Il malocchio del sale","Che gli si rovesci la saliera.","Che il sale si sparga su tutta la tovaglia.","Che ne butti un pizzico dietro la spalla e che finisca nella minestra.","Che la minestra sia di un altro.","Che sia la minestra della nonna, che è superstiziosissima."],"fogged-mirror":["Il malocchio dello specchio","Che lo specchio si appanni nel momento peggiore.","Che lo pulisca con la manica.","Che sia la manica di una camicia pulita.","Che lo specchio si riappanni all'istante.","Che non riesca mai a vedere cos'ha sulla fronte."],"under-ladder":["Il malocchio della scala","Che sulla sua strada ci sia una scala a pioli.","Che l'unico modo per girarle intorno sia passare in una pozzanghera.","Che ci passi sotto.","Che cada un pennello.","Che il pennello sia sporco di vernice blu e che lui sia vestito di bianco."],"indoor-umbrella":["Il malocchio dell'ombrello","Che l'ombrello gli si apra da solo in casa.","Che urti la mensola.","Che le chiavi cadano e rotolino sotto l'armadio.","Che l'ombrello non si richiuda più.","Che quel giorno non cada una goccia."],"spoken-luck":["Il malocchio del tocca ferro","Che si vanti che gli va tutto bene.","Che intorno non ci sia niente di ferro.","Che tocchi un tavolo di plastica.","Che lo sentano tutti.","Che un minuto dopo gli si rompa qualcosa, e che tutti si guardino."],"left-foot":["Il malocchio del piede sbagliato","Che si alzi col piede sbagliato.","Che il piede non trovi la ciabatta.","Che il pavimento sia gelato.","Che l'altra ciabatta ce l'abbia il gatto.","Che il gatto non la restituisca fino a sera."],"salt-for-sugar":["Il malocchio della zuccheriera","Che nella zuccheriera ci sia il sale.","Che ne metta due cucchiaini.","Che se ne accorga al primo sorso.","Che fosse l'ultima capsula di caffè in casa.","Che passi la giornata ad assaggiare lo zucchero con la punta del dito."],"white-back":["Il malocchio della schiena","Che gli dicano che ha qualcosa sulla schiena.","Che si giri.","Che si rigiri, più piano.","Che sulla schiena abbia davvero qualcosa.","Che sia un pesce di carta, attaccato lì dalla riunione del mattino."],"rubber-spider":["Il malocchio del ragno","Che nella sua tazza ci sia un ragno di gomma.","Che ci metta un po' a capire che è di gomma.","Che in quel momento abbia il caffè in mano.","Che il ragno successivo sia vero.","Che a quello vero non ci creda più."],"glued-coin":["Il malocchio della moneta","Che veda una moneta sul marciapiede.","Che sia incollata.","Che provi a staccarla.","Che lo stia guardando un gruppo intero.","Che il gruppo lo stia filmando."],"whoopee-cushion":["Il malocchio del cuscino","Che sulla sua sedia ci sia un cuscino con sorpresa.","Che ci si sieda sopra davanti a tutti.","Che suoni più forte di quanto chiunque si aspettasse.","Che proprio allora cali il silenzio.","Che qualcuno tolga il cuscino in silenzio, e che non resti nessuna prova."],"swapped-keyboard":["Il malocchio della tastiera","Che gli cambino la lingua della tastiera.","Che scriva mezza pagina prima di accorgersene.","Che il correttore sistemi il resto a modo suo.","Che la mail arrivi al capo.","Che il capo risponda allo stesso modo."],"tangled-garland":["Il malocchio delle lucine","Che le lucine escano dalla scatola in un gomitolo unico.","Che ci metta un'ora a districarle.","Che una lampadina non si accenda.","Che per colpa sua non se ne accenda nessuna.","Che si accendano tutte proprio mentre le rimette nella scatola."],"last-salad":["Il malocchio delle lenticchie","Che le lenticchie finiscano prima che arrivi lui.","Che ne resti un cucchiaio.","Che sia il fondo della pentola, tutto brodo e tre lenticchie.","Che la seconda pentola esca dopo la mezzanotte.","Che il primo gennaio la regalino ai vicini, con tutta la fortuna dentro."],"gift-socks":["Il malocchio del regalo","Che gli regalino dei calzini.","Che gliene regalino un altro paio.","Che il terzo paio abbia le renne.","Che tutti e tre gli chiedano se li mette subito.","Che li metta, e che la foto finisca nel gruppo di famiglia."],"missed-chimes":["Il malocchio del conto alla rovescia","Che cominci a esprimere il desiderio in ritardo.","Che al «meno dieci» stia ancora cercando il bicchiere.","Che il tappo dello spumante non ne voglia sapere di saltare.","Che salti a mezzanotte e un minuto, dritto nel lampadario.","Che si dimentichi il desiderio mentre tutti si fanno gli auguri."],"early-fireworks":["Il malocchio dei botti","Che i vicini comincino con i botti tre giorni prima.","Che sia ogni notte all'una.","Che il più forte scoppi sotto la sua finestra.","Che a Capodanno non gliene sia rimasto nemmeno uno.","Che il due gennaio ricomincino."],"tree-needles":["Il malocchio dell'albero","Che l'albero cominci a perdere aghi il secondo giorno.","Che trovi aghi nelle ciabatte.","Che li trovi anche nel letto.","Che ce ne siano ancora di più quando portano via l'albero.","Che trovi l'ultimo ago a Ferragosto."],"our-song":["Il malocchio della nostra canzone","Che al bar passi la canzone del suo ex.","Che passi anche nel bar dopo.","Che la metta la radio del taxi.","Che cominci a canticchiarla senza accorgersene.","Che il tassista gli faccia la seconda voce."],"booked-table":["Il malocchio del tavolo","Che tutti i tavoli della serata siano prenotati.","Che l'ultimo si liberi alle 23:40.","Che la cucina chiuda alle 23:45.","Che gli portino solo il cestino del pane.","Che i grissini siano di ieri, ma che of
